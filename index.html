<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вебтун - Глава 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    /* Ограничиваем максимальную ширину для удобства чтения на ПК */
    .reader-container {
      width: 100%;
      max-width: 800px;
      background: #000;
    }
    /* Бесшовное стыкование фрагментов */
    .reader-container img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="reader-container" id="reader">
    <!-- Сда создаются картинки -->
  </div>

  <script>
    // Укажите общее количество нарезанных кадров
    const TOTAL_PANELS = 15; 
    const container = document.getElementById('reader');

    for (let i = 0; i < TOTAL_PANELS; i++) {
      const img = document.createElement('img');
      
      // Форматируем индекс под 3 цифры (000, 001, 002...)
      const indexStr = String(i).padStart(3, '0');
      
      img.src = `images/panel_${indexStr}.jpg`;
      img.alt = `Страница ${i + 1}`;
      
      // Браузер загрузит картинку только при приближении к ней во время скролла
      img.loading = 'lazy'; 
      
      container.appendChild(img);
    }
  </script>

</body>
</html>
