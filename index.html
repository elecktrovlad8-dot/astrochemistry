<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Астрологическая Алхимия</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 25, 43, 0.95);
            --border-color: rgba(99, 102, 241, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --item-bg: #1e2238;
            --item-border: #3b4261;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1d36 0%, var(--bg-dark) 100%);
            color: var(--text-main); height: 100vh; display: flex; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        #menu-toggle {
            display: none; position: absolute; top: 15px; left: 15px;
            background: var(--item-bg); border: 1px solid var(--border-color);
            color: var(--text-main); width: 45px; height: 45px; border-radius: 8px;
            font-size: 1.5rem; z-index: 2000; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }

        #overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 1400;
        }
        #overlay.active { display: block; }

        #sidebar {
            width: 360px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            backdrop-filter: blur(10px); display: flex; flex-direction: column; z-index: 1500;
            transition: transform 0.3s ease-in-out;
        }

        .sidebar-header {
            padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color);
            font-weight: 600; letter-spacing: 1px; color: var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }
        #close-menu {
            display: none; background: none; border: none; color: var(--text-muted);
            font-size: 1.5rem; cursor: pointer;
        }

        .columns-container { display: flex; flex: 1; overflow: hidden; }
        .column { flex: 1; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
        .column:last-child { border-right: none; }
        .column-title { text-align: center; font-size: 0.75rem; padding: 10px 2px; background: rgba(0,0,0,0.2); color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .column-list { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 8px; }

        .spawn-btn {
            background: var(--item-bg); border: 1px solid var(--item-border); color: var(--text-main);
            padding: 10px 2px; border-radius: 8px; font-size: 1.2rem; text-align: center;
            cursor: pointer; transition: all 0.2s;
        }
        .spawn-btn:hover { background: #2a2f4c; border-color: var(--accent); transform: translateY(-2px); }

        #board { flex: 1; position: relative; overflow: hidden; }
        .instruction { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.2); pointer-events: none; line-height: 1.5; z-index: 5; }

        #trash-can {
            position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; background: rgba(22, 25, 43, 0.6);
            border: 2px dashed var(--item-border); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--text-muted); z-index: 10; transition: all 0.2s;
        }
        #trash-can.hovered { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; transform: scale(1.15); }

        #description-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 650px; max-height: 60vh;
            background: rgba(15, 17, 26, 0.95); border: 1px solid var(--accent); border-radius: 12px;
            padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
            flex-direction: column; z-index: 20; pointer-events: auto;
        }
        #desc-title { color: var(--accent); margin: 0 0 10px 0; font-size: 1.1rem; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        #desc-text { color: var(--text-main); font-size: 0.95rem; line-height: 1.4; margin: 0; overflow-y: auto; padding-right: 5px; }

        /* === БЛОКИ ОПИСАНИЯ === */
        .info-block {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            border-radius: 0 6px 6px 0;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .info-block.empty { border-left-color: #475569; background: rgba(0,0,0,0.2); }
        .info-block-title { font-weight: 600; color: #a5b4fc; margin-bottom: 4px; font-size: 0.9rem; }
        .info-block.empty .info-block-title { color: #64748b; }
        .info-block-text { font-size: 0.85rem; color: #cbd5e1; white-space: pre-wrap; }
        .info-block-text.empty { color: #64748b; font-style: italic; }
        .dev-key { font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; color: #fbbf24; font-size: 0.8rem; margin-top: 5px; display: inline-block; font-style: normal; }

        .inventory-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 8px 12px; margin-bottom: 6px;
            border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
        }
        .remove-btn {
            background: rgba(239, 68, 68, 0.8); color: white; border: none; border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem; transition: 0.2s;
        }
        .remove-btn:hover { background: rgba(239, 68, 68, 1); transform: scale(1.05); }
        .section-header { font-weight: bold; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin: 15px 0 10px 0; letter-spacing: 1px; }

        /* === ДОСКА И ЭЛЕМЕНТЫ === */
        .board-item {
            position: absolute; background: rgba(15, 17, 26, 0.3); 
            border: 1px solid rgba(129, 140, 248, 0.2); border-radius: 8px; padding: 6px 12px;
            font-size: 1.5rem; font-weight: bold; cursor: grab; transition: transform 0.2s, filter 0.2s, color 0.2s; touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            white-space: nowrap; text-align: center; line-height: 1.2; color: #e2e8f0; text-shadow: 0 0 10px rgba(129, 140, 248, 0.6);
        }
        .board-item:active { cursor: grabbing; }
        .board-item:hover { transform: scale(1.1); color: #ffffff; filter: drop-shadow(0 0 12px var(--accent)); }
        .board-item.highlight { color: #ffd700; transform: scale(1.2); filter: drop-shadow(0 0 15px #ffd700); }

        .board-item.person { color: #93c5fd; font-size: 2.2rem; text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
        .board-item.couple { color: #f9a8d4; font-size: 2.2rem; text-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
        .board-item.bounce { transition: left 0.3s ease, top 0.3s ease, color 0.3s ease; color: #ef4444 !important; filter: drop-shadow(0 0 15px #ef4444); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b4261; border-radius: 10px; }

        @media (max-width: 768px) {
            #menu-toggle { display: flex; }
            #sidebar { position: absolute; top: 0; left: 0; height: 100%; width: 320px; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.7); }
            #sidebar.open { transform: translateX(0); }
            #close-menu { display: block; }
            .instruction { display: none; }
            #description-panel { bottom: 90px; width: 90%; }
        }
    </style>
</head>
<body>

    <div id="overlay"></div>
    <div id="menu-toggle">☰</div>

    <div id="sidebar">
        <div class="sidebar-header">
            ЭЛЕМЕНТЫ
            <button id="close-menu">✖</button>
        </div>

        <div class="columns-container">

            </div>
            <div class="column">
                <div class="column-title">ПЛАНЕТЫ</div>
                <div class="column-list" id="list-planets"></div>
            </div>
            <div class="column">
                <div class="column-title">ДОМА</div>
                <div class="column-list" id="list-houses"></div>
            </div>
        </div>
    </div>

            Кидай готовые комбинации в Человека.<br>
            Соединяй людей для синастрии.<br>
            Кликни по элементу, чтобы прочесть описание.
        </div>
        <div id="trash-can">🗑️</div>
    </div>

    <div id="description-panel">
        <h3 id="desc-title">Символ</h3>
        <div id="desc-text">Описание...</div>
    </div>

        // =========================================================
        const PLANET_ORDER = [
            'sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'node_n', 'node_s', 'asc'
        ];

        const baseSigns = [
            { id: 'aries', name: '♈', type: 'sign', label: 'Овен' }, { id: 'taurus', name: '♉', type: 'sign', label: 'Телец' }, { id: 'gemini', name: '♊', type: 'sign', label: 'Близнецы' },
            { id: 'cancer', name: '♋', type: 'sign', label: 'Рак' }, { id: 'leo', name: '♌', type: 'sign', label: 'Лев' }, { id: 'virgo', name: '♍', type: 'sign', label: 'Дева' },
            { id: 'libra', name: '♎', type: 'sign', label: 'Весы' }, { id: 'scorpio', name: '♏', type: 'sign', label: 'Скорпион' }, { id: 'sagittarius', name: '♐', type: 'sign', label: 'Стрелец' },
            { id: 'capricorn', name: '♑', type: 'sign', label: 'Козерог' }, { id: 'aquarius', name: '♒', type: 'sign', label: 'Водолей' }, { id: 'pisces', name: '♓', type: 'sign', label: 'Рыбы' }
        ];

        const basePlanets = [
            { id: 'sun', name: '☉', type: 'planet', label: 'Солнце' }, { id: 'moon', name: '☽', type: 'planet', label: 'Луна' }, { id: 'mercury', name: '☿', type: 'planet', label: 'Меркурий' },
            { id: 'venus', name: '♀', type: 'planet', label: 'Венера' }, { id: 'mars', name: '♂', type: 'planet', label: 'Марс' }, { id: 'jupiter', name: '♃', type: 'planet', label: 'Юпитер' },
            { id: 'saturn', name: '♄', type: 'planet', label: 'Сатурн' }, { id: 'uranus', name: '♅', type: 'planet', label: 'Уран' }, { id: 'neptune', name: '♆', type: 'planet', label: 'Нептун' },
            { id: 'pluto', name: '♇', type: 'planet', label: 'Плутон' }, { id: 'node_n', name: '☊', type: 'planet', label: 'Сев. Узел' }, { id: 'node_s', name: '☋', type: 'planet', label: 'Юж. Узел' },
            { id: 'asc', name: '🌅', type: 'planet', label: 'Асцендент' }
        ];

        const baseHouses = [
            { id: 'h1', name: 'Ⅰ', type: 'house', label: '1 Дом' }, { id: 'h2', name: 'Ⅱ', type: 'house', label: '2 Дом' }, { id: 'h3', name: 'Ⅲ', type: 'house', label: '3 Дом' },
            { id: 'h4', name: 'Ⅳ', type: 'house', label: '4 Дом' }, { id: 'h5', name: 'Ⅴ', type: 'house', label: '5 Дом' }, { id: 'h6', name: 'Ⅵ', type: 'house', label: '6 Дом' },
            { id: 'h7', name: 'Ⅶ', type: 'house', label: '7 Дом' }, { id: 'h8', name: 'Ⅷ', type: 'house', label: '8 Дом' }, { id: 'h9', name: 'Ⅸ', type: 'house', label: '9 Дом' },
            { id: 'h10', name: 'Ⅹ', type: 'house', label: '10 Дом' }, { id: 'h11', name: 'Ⅺ', type: 'house', label: '11 Дом' }, { id: 'h12', name: 'Ⅻ', type: 'house', label: '12 Дом' }
        ];

        const elementsDict = {};
        [...baseSigns, ...basePlanets, ...baseHouses].forEach(item => elementsDict[item.id] = item);

        function sortFormulasByPlanetOrder(formulasList) {
            return formulasList.sort((a, b) => {
                const indexA = PLANET_ORDER.indexOf(a.planetId);
                const indexB = PLANET_ORDER.indexOf(b.planetId);
                return (indexA === -1 ? 99 : indexA) - (indexB === -1 ? 99 : indexB);
            });
        }

        const board = document.getElementById('board');
        const descPanel = document.getElementById('description-panel');
        const descTitle = document.getElementById('desc-title');
        const descText = document.getElementById('desc-text');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const trashCan = document.getElementById('trash-can');

        let zIndexCounter = 100; let activeDragElement = null;
        let startMouseX = 0, startMouseY = 0; let startItemX = 0, startItemY = 0;

        const activeElements = {}; let boardItems = [];

        document.getElementById('menu-toggle').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('active'); });
        document.getElementById('close-menu').addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
        function closeMenu() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }

        function populateMenu(listArray, containerId) {
            const container = document.getElementById(containerId);
            listArray.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'spawn-btn'; btn.innerText = item.name;
                btn.onclick = () => { spawnSingleItem(item.id); if (window.innerWidth <= 768) closeMenu(); };
                container.appendChild(btn);
            });
        }
        populateMenu(baseSigns, 'list-signs');
        populateMenu(basePlanets, 'list-planets');
        populateMenu(baseHouses, 'list-houses');

        document.getElementById('add-person-btn').addEventListener('click', () => { spawnPerson(); if (window.innerWidth <= 768) closeMenu(); });

        function createDOMNode(type, formulas, x, y, extraData = {}) {
            const uid = 'uid_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            if (formulas && Array.isArray(formulas)) sortFormulasByPlanetOrder(formulas);
            activeElements[uid] = { type, formulas, ...extraData };

            const el = document.createElement('div');
            el.className = 'board-item ' + type;
            el.dataset.uid = uid;
            el.innerHTML = renderItemHTML(activeElements[uid]);

            // --- СПАВН ЧУТЬ ВЫШЕ ПАНЕЛИ ОПИСАНИЯ ---
            if (x === null || y === null) {
                const boardRect = board.getBoundingClientRect();
                x = (boardRect.width / 2) - 40 + (Math.random() * 40 - 20);
                
                if (descPanel.style.display === 'flex') {
                    const descRect = descPanel.getBoundingClientRect();
                    y = (descRect.top - boardRect.top) - 75 + (Math.random() * 20 - 10);
                } else {
                    y = (boardRect.height * 0.35) - 30 + (Math.random() * 40 - 20);
                }
                if (y < 20) y = 20;
            }

            el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = zIndexCounter++;
            el.addEventListener('pointerdown', handleDragStart);
            board.appendChild(el); boardItems.push(el); return el;
        }

        function renderItemHTML(itemData) {
            if (itemData.type === 'person') {
                const count = itemData.inventory.length;
                return count > 0 ? `🧑<span style="font-size: 0.8rem; margin-top: 4px;">(${count})</span>` : `🧑`;
            }
            if (itemData.type === 'couple') return `👫`;
            return itemData.formulas.map(f => f.text).join('<br>');
        }

        function spawnSingleItem(id) {
            const item = elementsDict[id];
            const formula = { text: item.name, planetId: item.type === 'planet' ? id : null, signId: item.type === 'sign' ? id : null, houseId: item.type === 'house' ? id : null, isComplete: false };
            createDOMNode('astro', [formula], null, null);
        }
        function spawnPerson() { createDOMNode('person', null, null, null, { inventory: [] }); }
        function spawnCouple(p1, p2, targetNode) {
            const x = parseFloat(targetNode.style.left); const y = parseFloat(targetNode.style.top);
            createDOMNode('couple', null, x, y, { person1: p1, person2: p2 });
        }

        function updatePersonDOM(el, personData) {
            el.innerHTML = renderItemHTML(personData);
            el.style.transform = 'scale(1.3)'; setTimeout(() => { if (el) el.style.transform = ''; }, 200);
        }
        function removeNode(uid) {
            const el = document.querySelector(`[data-uid="${uid}"]`);
            if (el) el.remove();
            boardItems = boardItems.filter(item => item !== el); delete activeElements[uid];
        }

        function handleDragStart(e) {
            if (e.target.classList.contains('remove-btn')) return;
            activeDragElement = e.currentTarget;
            activeDragElement.style.zIndex = zIndexCounter++;
            startMouseX = e.clientX; startMouseY = e.clientY;
            startItemX = parseFloat(activeDragElement.style.left); startItemY = parseFloat(activeDragElement.style.top);
            const rect = activeDragElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
            document.addEventListener('pointermove', handleDragMove); document.addEventListener('pointerup', handleDragEnd);
        }
        function handleDragMove(e) {
            if (!activeDragElement) return;
            const boardRect = board.getBoundingClientRect();
            activeDragElement.style.left = (e.clientX - boardRect.left - offsetX) + 'px'; activeDragElement.style.top = (e.clientY - boardRect.top - offsetY) + 'px';
            if (isPointerOverTrash(e.clientX, e.clientY)) trashCan.classList.add('hovered'); else trashCan.classList.remove('hovered');
            checkHoverCollision();
        }
        function handleDragEnd(e) {
            if (!activeDragElement) return;
            document.removeEventListener('pointermove', handleDragMove); document.removeEventListener('pointerup', handleDragEnd);
            const dist = Math.hypot(e.clientX - startMouseX, e.clientY - startMouseY);
            const uid = activeDragElement.dataset.uid;
            if (isPointerOverTrash(e.clientX, e.clientY)) { removeNode(uid); trashCan.classList.remove('hovered'); activeDragElement = null; return; }
            if (dist < 5) { activeDragElement.style.left = startItemX + 'px'; activeDragElement.style.top = startItemY + 'px'; showDescription(uid); }
            else { attemptCombine(); }
            boardItems.forEach(item => item.classList.remove('highlight')); activeDragElement = null;
        }

        function isPointerOverTrash(x, y) {
            const rect = trashCan.getBoundingClientRect(); return (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
        }
        function getCollidingElement(sourceEl) {
            const rect1 = sourceEl.getBoundingClientRect();
            for (let targetEl of boardItems) {
                if (targetEl === sourceEl) continue;
                const rect2 = targetEl.getBoundingClientRect();
                if (!(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom)) return targetEl;
            }
            return null;
        }
        function checkHoverCollision() {
            boardItems.forEach(item => item.classList.remove('highlight'));
            const colliding = getCollidingElement(activeDragElement); if (colliding) colliding.classList.add('highlight');
        }

        function bounceSource() {
            activeDragElement.classList.add('bounce');
            activeDragElement.style.left = startItemX + 'px'; activeDragElement.style.top = startItemY + 'px';
            setTimeout(() => { if (activeDragElement) activeDragElement.classList.remove('bounce'); }, 300);
        }

        function mergeTwoFormulas(f1, f2) {
            if (f1.planetId && f2.planetId) return null; if (f1.signId && f2.signId) return null; if (f1.houseId && f2.houseId) return null;
            const planetId = f1.planetId || f2.planetId; const signId = f1.signId || f2.signId; const houseId = f1.houseId || f2.houseId;
            let text = '';
            if (planetId) text += elementsDict[planetId].name + ' ';
            if (signId) text += elementsDict[signId].name + ' ';
            if (houseId) text += elementsDict[houseId].name;
            const isComplete = Boolean(planetId && signId && houseId);
            return { text: text.trim(), planetId, signId, houseId, isComplete };
        }

        function attemptCombine() {
            const targetEl = getCollidingElement(activeDragElement);
            if (!targetEl) return;
            const sourceUid = activeDragElement.dataset.uid; const targetUid = targetEl.dataset.uid;
            const source = activeElements[sourceUid]; const target = activeElements[targetUid];

            if (source.type === 'person' && target.type === 'person') {
                spawnCouple(source, target, targetEl); removeNode(sourceUid); removeNode(targetUid); return;
            }
            if (source.type === 'couple' || target.type === 'couple') { bounceSource(); return; }

            if (source.type === 'astro' && target.type === 'person') {
                if (addFormulasToPerson(source.formulas, target)) { updatePersonDOM(targetEl, target); removeNode(sourceUid); } else bounceSource();
                return;
            }
            if (source.type === 'person' && target.type === 'astro') {
                if (addFormulasToPerson(target.formulas, source)) { updatePersonDOM(activeDragElement, source); removeNode(targetUid); } else bounceSource();
                return;
            }

            if (source.type === 'astro' && target.type === 'astro') {
                const sourceAllComplete = source.formulas.every(f => f.isComplete);
                const targetAllComplete = target.formulas.every(f => f.isComplete);

                if (source.formulas.length === 1 && target.formulas.length === 1 && !sourceAllComplete && !targetAllComplete) {
                    const mergedFormula = mergeTwoFormulas(source.formulas[0], target.formulas[0]);
                    if (mergedFormula) {
                        const x = parseFloat(targetEl.style.left); const y = parseFloat(targetEl.style.top);
                        createDOMNode('astro', [mergedFormula], x, y); removeNode(sourceUid); removeNode(targetUid); return;
                    }
                }

                if (sourceAllComplete && targetAllComplete) {
                    const sourcePlanets = source.formulas.map(f => f.planetId).filter(Boolean);
                    const targetPlanets = target.formulas.map(f => f.planetId).filter(Boolean);
                    const hasOverlap = sourcePlanets.some(p => targetPlanets.includes(p));
                    if (!hasOverlap) {
                        const combinedFormulas = [...source.formulas, ...target.formulas];
                        const x = parseFloat(targetEl.style.left); const y = parseFloat(targetEl.style.top);
                        createDOMNode('astro', combinedFormulas, x, y); removeNode(sourceUid); removeNode(targetUid); return;
                    }
                }
            }
            bounceSource();
        }

        function addFormulasToPerson(formulasToAdd, person) {
            const allComplete = formulasToAdd.every(f => f.isComplete);
            if (!allComplete) return false;
            const existingPlanets = person.inventory.map(f => f.planetId).filter(Boolean);
            const newPlanets = formulasToAdd.map(f => f.planetId).filter(Boolean);
            const hasOverlap = newPlanets.some(p => existingPlanets.includes(p));
            if (hasOverlap) return false;
            person.inventory.push(...formulasToAdd); sortFormulasByPlanetOrder(person.inventory);
            return true;
        }

        window.extractFromPerson = function(personUid, index) {
            const person = activeElements[personUid]; if (!person) return;
            const extractedFormula = person.inventory.splice(index, 1)[0];
            const personEl = document.querySelector(`[data-uid="${personUid}"]`);
            if (personEl) updatePersonDOM(personEl, person);
            const spawnX = personEl ? parseFloat(personEl.style.left) + 50 : null;
            const spawnY = personEl ? parseFloat(personEl.style.top) + 50 : null;
            createDOMNode('astro', [extractedFormula], spawnX, spawnY);
            showDescription(personUid);
        }

        // =========================================================
        // ГЕНЕРАТОР БЛОКОВ ОПИСАНИЯ
        // =========================================================
        function createInfoBlock(key, title) {
            const text = DESCRIPTIONS_DB[key];
            const block = document.createElement('div');
            
            if (text) {
                block.className = 'info-block';
                block.innerHTML = `
                    <div class="info-block-title">${title}</div>
                    <div class="info-block-text">${text}</div>
                `;
            } else {
                block.className = 'info-block empty';
                block.innerHTML = `
                    <div class="info-block-title">${title}</div>
                    <div class="info-block-text empty">
                        Текст пока не добавлен.<br>
                        <span class="dev-key">Ключ для словаря: <b>'${key}'</b></span>
                    </div>
                `;
            }
            return block;
        }

        function appendFormulaInterpretation(f, container) {
            const wrapper = document.createElement('div');
            wrapper.style.marginBottom = '20px';
            
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = f.text;
            wrapper.appendChild(header);

            const keysToRender = [];
            const parts = [];
            
            if (f.planetId) parts.push(f.planetId);
            if (f.signId) parts.push(f.signId);
            if (f.houseId) parts.push(f.houseId);

            if (parts.length > 1) {
                const comboKey = parts.join('_');
                keysToRender.push({ key: comboKey, title: '✨ Синтез связки' });
            }

            if (f.planetId) keysToRender.push({ key: f.planetId, title: `🪐 ${elementsDict[f.planetId].label} (Планета)` });
            if (f.signId) keysToRender.push({ key: f.signId, title: `🌌 ${elementsDict[f.signId].label} (Знак)` });
            if (f.houseId) keysToRender.push({ key: f.houseId, title: `🏠 ${elementsDict[f.houseId].label} (Дом)` });

            keysToRender.forEach(k => {
                wrapper.appendChild(createInfoBlock(k.key, k.title));
            });

            container.appendChild(wrapper);
        }

        function showDescription(uid) {
            const item = activeElements[uid];
            if (!item) return;

            descText.innerHTML = ''; 

            if (item.type === 'person') {
                descTitle.innerText = "🧑 Карта человека";
                if (item.inventory.length === 0) {
                    descText.innerHTML = `<div class="info-block"><div class="info-block-text">Человек пуст. Перетащите сюда готовые комбинации (Планета+Знак+Дом).</div></div>`;
                } else {
                    const editSection = document.createElement('div');
                    editSection.innerHTML = `<div class="section-header">Содержимое карты (Редактор)</div>`;
                    item.inventory.forEach((f, index) => {
                        const row = document.createElement('div');
                        row.className = 'inventory-item';
                        row.innerHTML = `<span>${f.text}</span> <button class="remove-btn" onclick="extractFromPerson('${uid}', ${index})">Извлечь</button>`;
                        editSection.appendChild(row);
                    });
                    descText.appendChild(editSection);

                    const analysisSection = document.createElement('div');
                    analysisSection.innerHTML = `<div class="section-header" style="margin-top:25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">Трактовка аспектов</div>`;
                    item.inventory.forEach(f => appendFormulaInterpretation(f, analysisSection));
                    descText.appendChild(analysisSection);
                }
            } 
            else if (item.type === 'couple') {
                descTitle.innerText = "👫 Синастрия (Совместимость пар)";
                
                const p1 = item.person1;
                const p2 = item.person2;

                if ((!p1.inventory || p1.inventory.length === 0) && (!p2.inventory || p2.inventory.length === 0)) {
                    descText.innerHTML = `<div class="info-block"><div class="info-block-text">Оба партнера пусты. Наполните их картами (Планета+Знак+Дом) для расчета взаимодействия.</div></div>`;
                    descPanel.style.display = 'flex';
                    return;
                }

                // --- 1. ВЗАИМОДЕЙСТВИЕ ПАРТНЕРОВ (СВЯЗКИ МЕЖДУ КАРТАМИ) ---
                const synastrySection = document.createElement('div');
                synastrySection.innerHTML = `<div class="section-header" style="color: var(--accent); font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">🔥 Межкарточные связки (Взаимодействие)</div>`;

                let hasInteractions = false;

                if (p1.inventory && p2.inventory) {
                    p1.inventory.forEach(f1 => {
                        p2.inventory.forEach(f2 => {
                            hasInteractions = true;
                            const wrapper = document.createElement('div');
                            wrapper.style.marginBottom = '15px';

                            const header = document.createElement('div');
                            header.className = 'section-header';
                            header.style.color = '#f9a8d4';
                            header.innerText = `П1 (${f1.text}) ↔ П2 (${f2.text})`;
                            wrapper.appendChild(header);

                            // Межпланетарная связь
                            if (f1.planetId && f2.planetId) {
                                const pKey = `syn_${f1.planetId}_${f2.planetId}`;
                                const title = `✨ ${elementsDict[f1.planetId].label} (П1) + ${elementsDict[f2.planetId].label} (П2)`;
                                wrapper.appendChild(createInfoBlock(pKey, title));
                            }

                            // Планета П1 в Доме П2
                            if (f1.planetId && f2.houseId) {
                                const hKey = `syn_${f1.planetId}_${f2.houseId}`;
                                const title = `🏠 ${elementsDict[f1.planetId].label} (П1) в ${elementsDict[f2.houseId].label} (П2)`;
                                wrapper.appendChild(createInfoBlock(hKey, title));
                            }

                            synastrySection.appendChild(wrapper);
                        });
                    });
                }

                if (!hasInteractions) {
                    synastrySection.innerHTML += `<div class="info-block"><div class="info-block-text">Добавьте хотя бы по одной комбинации каждому партнеру для расчета связок.</div></div>`;
                }
                descText.appendChild(synastrySection);

                // --- 2. ПОЛНОЕ ОПИСАНИЕ КАРТЫ ПАРТНЕРА 1 ---
                const p1Section = document.createElement('div');
                p1Section.style.marginTop = '25px';
                p1Section.innerHTML = `<div class="section-header" style="color: #93c5fd; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">🧑 Карта Партнера 1</div>`;
                if (p1.inventory && p1.inventory.length > 0) {
                    p1.inventory.forEach(f => appendFormulaInterpretation(f, p1Section));
                } else {
                    p1Section.innerHTML += `<div class="info-block"><div class="info-block-text">Карта пуста</div></div>`;
                }
                descText.appendChild(p1Section);

                // --- 3. ПОЛНОЕ ОПИСАНИЕ КАРТЫ ПАРТНЕРА 2 ---
                const p2Section = document.createElement('div');
                p2Section.style.marginTop = '25px';
                p2Section.innerHTML = `<div class="section-header" style="color: #f9a8d4; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">🧑 Карта Партнера 2</div>`;
                if (p2.inventory && p2.inventory.length > 0) {
                    p2.inventory.forEach(f => appendFormulaInterpretation(f, p2Section));
                } else {
                    p2Section.innerHTML += `<div class="info-block"><div class="info-block-text">Карта пуста</div></div>`;
                }
                descText.appendChild(p2Section);
            } 
            else {
                descTitle.innerText = "Разбор комбинации";
                item.formulas.forEach(f => appendFormulaInterpretation(f, descText));
            }
            descPanel.style.display = 'flex';
        }

        board.addEventListener('click', (e) => {
            if (e.target === board || e.target === trashCan || e.target.classList.contains('instruction')) {
                descPanel.style.display = 'none';
            }
        });

    </script>
</body>
</html>
