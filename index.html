<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyFlow - Premium Planner</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            background: 'var(--bg-color)', 
            surface: 'var(--surface-color)', 
            primary: '#8eb382', /* Приглушенный салатовый */
            primaryHover: '#799e6d',
            accent: '#e9c46a',
            glass: 'var(--glass-bg)',
            glassBorder: 'var(--glass-border)',
            textMain: 'var(--text-main)',
            textMuted: 'var(--text-muted)'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg-color: #f4f7f4;
      --surface-color: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.05);
      --text-main: #2d372d;
      --text-muted: #7b8a7b;
    }

    .dark {
      --bg-color: #121612;
      --surface-color: #1a201a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .glass-panel {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 1.25rem; 
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    ::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    .dark ::-webkit-calendar-picker-indicator { filter: invert(1); }

    /* Прячем скроллбар в списках, чтобы было чище */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- Утилиты ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    // Работа с датами
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    
    const getRelativeDateStr = (dateStr) => {
      if (!dateStr) return '';
      const today = new Date(getTodayStr());
      const target = new Date(dateStr);
      const diffTime = target - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return 'Сегодня';
      if (diffDays === 1) return 'Завтра';
      if (diffDays === 2) return 'Послезавтра';
      if (diffDays === -1) return 'Вчера (Просрочено)';
      if (diffDays < -1) return `Просрочено на ${Math.abs(diffDays)} дн.`;
      
      // Форматируем красиво для дальних дат
      return target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    };

    // --- Иконки ---
    const IconHome = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconCalendar = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconSettings = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconChevronRight = ({ className = "" }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
    const IconCheckCircle = ({ className = "" }) => <svg className={className} width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconClock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconUpload = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;

    // --- Стейт Менеджмент (Контекст) ---
    const TaskContext = createContext();

    const initialData = [
      { id: '1', title: 'Оформить проект', subject: 'Учеба', description: '', priority: 'normal', color: '#8eb382', status: 'active', parentId: null, deadline: getTodayStr(), createdAt: getTodayStr() }
    ];

    const AppProvider = ({ children }) => {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('studyflow-tasks-v2');
        return saved ? JSON.parse(saved) : initialData;
      });
      const [toasts, setToasts] = useState([]);
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('studyflow-theme-v2');
        return saved ? saved === 'dark' : true;
      });

      useEffect(() => { localStorage.setItem('studyflow-tasks-v2', JSON.stringify(tasks)); }, [tasks]);
      
      useEffect(() => {
        localStorage.setItem('studyflow-theme-v2', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      const addToast = (message, type = 'success') => {
        const id = generateId();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const toggleComplete = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: t.status === 'completed' ? 'active' : 'completed' } : t));
      };

      const addTask = (task) => {
        setTasks(prev => [...prev, { ...task, id: generateId(), createdAt: getTodayStr(), status: 'active' }]);
        addToast('Задача добавлена');
      };

      const deleteTask = (id) => {
        const getChildrenIds = (parentId, allTasks) => {
          const children = allTasks.filter(t => t.parentId === parentId);
          return children.reduce((acc, child) => [...acc, child.id, ...getChildrenIds(child.id, allTasks)], []);
        };
        const idsToRemove = [id, ...getChildrenIds(id, tasks)];
        setTasks(prev => prev.filter(t => !idsToRemove.includes(t.id)));
        addToast('Задача удалена');
      };

      return (
        <TaskContext.Provider value={{ tasks, setTasks, toggleComplete, addTask, deleteTask, isDark, setIsDark, addToast }}>
          {children}
          {/* Уведомления */}
          <div className="fixed top-6 right-6 z-50 flex flex-col gap-2">
            <AnimatePresence>
              {toasts.map(toast => (
                <motion.div key={toast.id} initial={{ opacity: 0, y: -20, scale: 0.9 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.9 }}
                  className={`px-4 py-3 rounded-xl shadow-lg border backdrop-blur-md text-sm font-medium flex items-center gap-3 bg-surface/90 border-glassBorder text-textMain`}>
                  {toast.type === 'error' ? <IconTrash className="text-red-500" /> : <IconCheckCircle className="text-primary" />}
                  {toast.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </TaskContext.Provider>
      );
    };

    // --- Компонент задачи (TaskItem) ---
    const TaskItem = ({ task, level = 0, onAddSubtask }) => {
      const { tasks, toggleComplete, deleteTask } = useContext(TaskContext);
      const [isExpanded, setIsExpanded] = useState(false);
      
      const children = tasks.filter(t => t.parentId === task.id);
      const isCompleted = task.status === 'completed';
      const completedChildren = children.filter(c => c.status === 'completed').length;
      const progress = children.length > 0 ? Math.round((completedChildren / children.length) * 100) : null;

      const dateStatusStr = getRelativeDateStr(task.deadline);
      const isOverdue = task.deadline && task.deadline < getTodayStr() && !isCompleted;

      return (
        <div className="w-full">
          <div className={`group flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl transition-all duration-200 hover:bg-black/5 dark:hover:bg-white/5 border border-transparent hover:border-black/5 dark:hover:border-white/5 ${isCompleted ? 'opacity-50 grayscale' : 'opacity-100'}`}>
            
            {/* Левая часть: Иконки и Текст */}
            <div className="flex items-start gap-3 flex-1 min-w-0">
              <button onClick={() => setIsExpanded(!isExpanded)} className={`p-1 mt-0.5 rounded-md hover:bg-black/10 dark:hover:bg-white/10 transition-colors ${children.length === 0 ? 'invisible' : ''}`}>
                <motion.div animate={{ rotate: isExpanded ? 90 : 0 }}><IconChevronRight className="text-textMuted" /></motion.div>
              </button>
              
              <button onClick={() => toggleComplete(task.id)} className="text-primary hover:scale-110 transition-transform flex-shrink-0 mt-0.5">
                {isCompleted ? <IconCheckCircle /> : <IconCircle />}
              </button>
              
              <div className="flex-1 flex flex-col cursor-pointer min-w-0" onClick={() => setIsExpanded(!isExpanded)}>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-[15px] font-medium transition-all break-words ${isCompleted ? 'line-through text-textMuted' : 'text-textMain'}`}>{task.title}</span>
                  {progress !== null && !isCompleted && <span className="text-xs bg-black/5 dark:bg-white/10 px-2 py-0.5 rounded-full text-textMuted">{progress}%</span>}
                </div>
                
                <div className="flex gap-2 mt-1.5 text-xs text-textMuted items-center flex-wrap">
                  {task.subject && <span className="bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded-md border border-glassBorder">{task.subject}</span>}
                  {task.deadline && (
                    <span className={`flex items-center gap-1 bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded-md border border-glassBorder ${isOverdue ? 'text-red-500 border-red-500/30 bg-red-500/10' : ''}`}>
                      <IconClock /> {dateStatusStr}
                    </span>
                  )}
                </div>
              </div>
            </div>

            {/* Правая часть: Кнопки (на мобилках спускаются вниз) */}
            <div className="flex items-center gap-2 mt-3 sm:mt-0 ml-12 sm:ml-0 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
               <button onClick={() => onAddSubtask(task.id)} className="flex items-center gap-1 px-2 py-1.5 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 rounded-md text-textMuted hover:text-textMain transition-colors text-xs font-medium">
                 <IconPlus /> Подзадача
               </button>
               <button onClick={() => deleteTask(task.id)} className="p-1.5 hover:bg-red-500/10 rounded-md text-textMuted hover:text-red-500 transition-colors" title="Удалить">
                 <IconTrash />
               </button>
               <div className="w-2.5 h-2.5 rounded-full shadow-sm ml-2" style={{ backgroundColor: task.color || '#8eb382' }} />
            </div>
          </div>

          {/* Подзадачи */}
          <AnimatePresence>
            {isExpanded && children.length > 0 && (
              <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                <div className="ml-4 sm:ml-7 pl-2 border-l border-glassBorder flex flex-col gap-1 mt-1 mb-2">
                  {children.map(child => <TaskItem key={child.id} task={child} level={level + 1} onAddSubtask={onAddSubtask} />)}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    // --- Модальное окно ---
    const AddTaskModal = ({ isOpen, onClose, parentId = null, initialDate = '' }) => {
      const { addTask } = useContext(TaskContext);
      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        addTask({
          title: e.target.title.value,
          subject: e.target.subject ? e.target.subject.value : '',
          deadline: e.target.deadline.value,
          color: e.target.color.value,
          parentId
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm transition-opacity">
          <motion.div initial={{ y: '100%' }} animate={{ y: 0 }} className="glass-panel w-full sm:max-w-lg p-6 bg-surface shadow-2xl rounded-t-3xl sm:rounded-2xl pb-10 sm:pb-6">
            <div className="w-12 h-1.5 bg-glassBorder rounded-full mx-auto mb-6 sm:hidden"></div>
            <h2 className="text-xl font-bold mb-5 text-textMain">{parentId ? 'Новая подзадача' : 'Новое задание'}</h2>
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              <input name="title" required autoFocus className="w-full bg-black/5 dark:bg-black/20 border border-glassBorder rounded-xl px-4 py-3 text-textMain outline-none focus:border-primary transition-colors font-medium" placeholder="Что нужно сделать?" />
              
              {!parentId && <input name="subject" className="w-full bg-black/5 dark:bg-black/20 border border-glassBorder rounded-xl px-4 py-3 text-textMain outline-none focus:border-primary transition-colors text-sm" placeholder="Категория или предмет" />}

              <div className="grid grid-cols-2 gap-4">
                <div className="bg-black/5 dark:bg-black/20 border border-glassBorder rounded-xl px-4 py-2.5 flex flex-col">
                  <label className="text-[10px] uppercase text-textMuted font-bold mb-1">Дедлайн (Мини-календарь)</label>
                  <input name="deadline" type="date" defaultValue={initialDate} className="w-full bg-transparent text-textMain outline-none text-sm cursor-pointer" />
                </div>
                <div className="bg-black/5 dark:bg-black/20 border border-glassBorder rounded-xl px-4 py-2.5 flex flex-col justify-center">
                   <label className="text-[10px] uppercase text-textMuted font-bold mb-1">Цвет метки</label>
                   <input name="color" type="color" defaultValue="#8eb382" className="h-6 w-full bg-transparent cursor-pointer rounded" />
                </div>
              </div>
              
              <div className="flex justify-end gap-3 mt-4">
                <button type="button" onClick={onClose} className="px-5 py-2.5 text-textMuted hover:bg-black/5 dark:hover:bg-white/5 rounded-xl transition-colors font-medium">Отмена</button>
                <button type="submit" className="px-6 py-2.5 bg-primary hover:bg-primaryHover text-white font-medium rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-95">Сохранить</button>
              </div>
            </form>
          </motion.div>
        </div>
      );
    };

    // --- Разделы ---
    // 1. Главная
    const Dashboard = ({ openModal }) => {
      const { tasks } = useContext(TaskContext);
      
      const todayStr = getTodayStr();
      const allRoot = tasks.filter(t => t.parentId === null);
      
      // Считаем прогресс ЗА СЕГОДНЯ (созданные сегодня или с дедлайном сегодня)
      const todayTasks = allRoot.filter(t => t.deadline === todayStr || t.createdAt === todayStr);
      const todayCompleted = todayTasks.filter(t => t.status === 'completed').length;
      const progressToday = todayTasks.length === 0 ? 0 : Math.round((todayCompleted / todayTasks.length) * 100);

      const activeRoot = allRoot.filter(t => t.status === 'active');
      const completedRoot = allRoot.filter(t => t.status === 'completed'); // Чтобы можно было вернуть задачу

      return (
        <div className="animate-fade-in pb-32 sm:pb-10">
          <header className="mb-8">
            <h1 className="text-2xl sm:text-3xl font-bold text-textMain mb-3 tracking-tight">Ваш план</h1>
            <div className="glass-panel p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-primary/10 border-primary/20">
              <div>
                <h3 className="font-semibold text-textMain">Прогресс за сегодня</h3>
                <p className="text-sm text-textMuted">Выполнено {todayCompleted} из {todayTasks.length} задач</p>
              </div>
              <div className="w-full sm:w-1/2 flex items-center gap-3">
                <div className="flex-1 h-3 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden shadow-inner">
                  <motion.div initial={{ width: 0 }} animate={{ width: `${progressToday}%` }} className="h-full bg-primary rounded-full" />
                </div>
                <span className="text-sm font-bold text-primary">{progressToday}%</span>
              </div>
            </div>
          </header>

          <div className="glass-panel p-2 mb-6">
            <div className="flex justify-between items-center p-4 mb-2 border-b border-glassBorder">
              <h2 className="text-lg font-semibold text-textMain">Активные задания</h2>
              <button onClick={() => openModal()} className="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-primary/20">
                + Добавить
              </button>
            </div>
            <div className="p-2">
              {activeRoot.length === 0 ? 
                <div className="text-center text-textMuted py-10">На сегодня всё! Отдыхайте. 🍵</div> : 
                activeRoot.map(task => <TaskItem key={task.id} task={task} onAddSubtask={openModal} />)
              }
            </div>
          </div>

          {/* Блок для возврата выполненных задач */}
          {completedRoot.length > 0 && (
            <div className="p-2">
              <h3 className="text-sm font-bold text-textMuted uppercase tracking-wider mb-3 pl-2">Выполненные</h3>
              <div className="flex flex-col gap-1 opacity-70">
                {completedRoot.map(task => <TaskItem key={task.id} task={task} onAddSubtask={openModal} />)}
              </div>
            </div>
          )}
        </div>
      );
    };

    // 2. Календарь
    const CalendarView = ({ openModal }) => {
      const { tasks } = useContext(TaskContext);
      const [currentMonth, setCurrentMonth] = useState(() => {
        const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1);
      });
      
      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1; // Сдвиг для ПН
      
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
      
      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

      return (
        <div className="animate-fade-in pb-32 sm:pb-10 h-full flex flex-col">
          <header className="mb-6 flex justify-between items-center">
            <h1 className="text-2xl font-bold text-textMain">Календарь</h1>
            <div className="flex items-center gap-2 bg-surface p-1 rounded-xl border border-glassBorder">
              <button onClick={prevMonth} className="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"><IconChevronRight className="rotate-180" /></button>
              <span className="font-medium text-sm w-28 text-center">{monthNames[currentMonth.getMonth()]} {currentMonth.getFullYear()}</span>
              <button onClick={nextMonth} className="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"><IconChevronRight /></button>
            </div>
          </header>

          <div className="glass-panel flex-1 p-4 sm:p-6 flex flex-col">
            <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-[10px] sm:text-xs font-bold text-textMuted uppercase">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-400/80">Сб</div><div className="text-red-400/80">Вс</div>
            </div>
            
            <div className="grid grid-cols-7 gap-1 sm:gap-2 flex-1 auto-rows-fr">
              {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} className="rounded-xl bg-black/5 dark:bg-white/5 opacity-30"></div>)}
              
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = tasks.filter(t => t.deadline === dateStr);
                const isToday = dateStr === getTodayStr();

                return (
                  <div key={day} onClick={() => openModal(null, dateStr)} className={`p-1 sm:p-2 rounded-xl border flex flex-col gap-1 cursor-pointer transition-colors ${isToday ? 'border-primary bg-primary/10' : 'border-glassBorder bg-surface hover:border-primary/50'}`}>
                    <div className="flex justify-between items-center px-1">
                      <span className={`text-xs sm:text-sm font-bold ${isToday ? 'text-primary' : 'text-textMain'}`}>{day}</span>
                      {dayTasks.length > 0 && <span className="w-1.5 h-1.5 rounded-full bg-primary sm:hidden"></span>}
                    </div>
                    <div className="hidden sm:flex flex-col gap-1 overflow-y-auto no-scrollbar max-h-20">
                      {dayTasks.map(t => (
                        <div key={t.id} className={`text-[10px] px-1.5 py-0.5 rounded flex items-center gap-1 truncate ${t.status === 'completed' ? 'opacity-50 line-through' : 'bg-primary/20 text-textMain'}`}>
                          {t.title}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
            <p className="text-center text-xs text-textMuted mt-4">Нажмите на любой день, чтобы добавить дедлайн</p>
          </div>
        </div>
      );
    };

    // 3. Настройки
    const SettingsView = () => {
      const { setTasks, addToast, isDark, setIsDark } = useContext(TaskContext);
      const fileInputRef = useRef(null);

      const exportData = () => {
        const blob = new Blob([localStorage.getItem('studyflow-tasks-v2')], { type: "application/json" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'studyflow-backup.json'; a.click();
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const json = JSON.parse(event.target.result);
            if (Array.isArray(json)) {
              setTasks(json);
              addToast('Данные успешно загружены!');
            } else { throw new Error(); }
          } catch (err) {
            addToast('Ошибка файла. Нужен JSON массив.', 'error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="animate-fade-in pb-32 sm:pb-10 max-w-2xl">
          <h1 className="text-2xl font-bold text-textMain mb-6">Настройки</h1>
          
          <div className="glass-panel p-6 flex flex-col gap-8 mb-6">
            <div className="flex items-center justify-between border-b border-glassBorder pb-6">
              <div>
                <h3 className="font-semibold text-textMain">Оформление</h3>
                <p className="text-textMuted text-sm">Светлая или темная тема.</p>
              </div>
              <button onClick={() => setIsDark(!isDark)} className="flex items-center gap-2 px-4 py-2 bg-surface text-textMain rounded-xl border border-glassBorder shadow-sm">
                <IconSun className="w-5 h-5"/>
              </button>
            </div>

            <div>
              <h3 className="font-semibold text-textMain mb-1">Данные (Резервная копия)</h3>
              <p className="text-textMuted text-sm mb-4">Вы можете скачать свои задачи или загрузить их с другого устройства.</p>
              <div className="flex gap-3">
                <button onClick={exportData} className="px-4 py-2 bg-surface text-textMain rounded-xl border border-glassBorder hover:border-primary transition-colors text-sm font-medium flex items-center gap-2">
                  Скачать JSON
                </button>
                <button onClick={() => fileInputRef.current.click()} className="px-4 py-2 bg-primary/20 text-primary rounded-xl border border-primary/20 hover:bg-primary hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
                  <IconUpload /> Загрузить
                </button>
                <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={importData} />
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Главный Скелет Приложения ---
    const App = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalData, setModalData] = useState({ parentId: null, date: '' });

      const navItems = [
        { id: 'dashboard', icon: IconHome, label: 'Главная' },
        { id: 'calendar', icon: IconCalendar, label: 'Календарь' },
        { id: 'settings', icon: IconSettings, label: 'Настройки' }
      ];

      const openModal = (parentId = null, date = '') => { 
        setModalData({ parentId, date }); 
        setIsModalOpen(true); 
      };

      const NavButton = ({ item, isMobile = false }) => (
        <button onClick={() => setCurrentView(item.id)} 
          className={isMobile ? 
            `flex flex-col items-center gap-1 p-2 w-20 rounded-xl transition-all ${currentView === item.id ? 'text-primary' : 'text-textMuted'}` :
            `flex items-center gap-3 px-4 py-3 rounded-xl transition-all w-full text-left ${currentView === item.id ? 'bg-primary/10 text-primary font-medium' : 'text-textMuted hover:bg-black/5 dark:hover:bg-white/5 hover:text-textMain'}`
          }>
          <item.icon /> 
          <span className={isMobile ? 'text-[10px] font-medium' : ''}>{item.label}</span>
        </button>
      );

      return (
        <div className="flex h-screen w-full relative">
          
          {/* Боковая панель (ПК) */}
          <aside className="hidden md:flex w-64 h-full border-r border-glassBorder bg-surface/50 backdrop-blur-xl flex-col p-6 z-10 shadow-2xl">
            <div className="flex items-center gap-3 mb-10 text-textMain cursor-pointer" onClick={() => setCurrentView('dashboard')}>
              <div className="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/30"><span className="font-bold text-xl text-white">S</span></div>
              <span className="text-xl font-bold tracking-wide">StudyFlow</span>
            </div>
            <nav className="flex flex-col gap-2">
              {navItems.map(item => <NavButton key={item.id} item={item} />)}
            </nav>
          </aside>

          {/* Нижняя панель (Мобилки) - Полностью решает проблему вкладок */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-glassBorder flex justify-around items-center p-2 z-[90] pb-safe">
            {navItems.map(item => <NavButton key={item.id} item={item} isMobile={true} />)}
          </nav>

          {/* Контент */}
          <main className="flex-1 h-full overflow-y-auto p-4 sm:p-8 relative no-scrollbar">
            {currentView === 'dashboard' && <Dashboard openModal={openModal} />}
            {currentView === 'calendar' && <CalendarView openModal={openModal} />}
            {currentView === 'settings' && <SettingsView />}
          </main>
          
          <AddTaskModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} parentId={modalData.parentId} initialDate={modalData.date} />
        </div>
      );
    }

    const Root = () => <AppProvider><App /></AppProvider>;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
