                                    <button onClick={calculateVoting} className="w-full py-6 rounded-full bg-gradient-to-r from-rose-700 to-rose-500 text-white font-black text-xl sm:text-2xl tracking-[0.2em] uppercase transition-all duration-400 transform active:scale-[0.98] shadow-[0_20px_50px_rgba(225,29,72,0.6)] border-2 border-rose-400 relative overflow-hidden group flex items-center justify-center gap-4">
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity" />
                                        <Icon name="Check" size={28} className="relative z-10" />
                                        <span className="relative z-10 drop-shadow-sm">Фиксировать вердикт</span>
                                    </button>
                                )}

                                {phase === PHASES.NIGHT && (
                                    <button onClick={() => handleNightAction(null)} className="w-full py-6 rounded-full bg-slate-900/90 backdrop-blur-xl hover:bg-slate-800 text-white font-black text-xl sm:text-2xl tracking-[0.2em] uppercase transition-all duration-400 transform active:scale-[0.98] shadow-2xl border-2 border-white/20">
                                        Действие не требуется (Пропуск)
                                    </button>
                                )}

                                {phase === PHASES.BRIEFING && (
                                    <button onClick={() => {
                                        saveToHistory();
                                        haptic('success');
                                        triggerSound('select');
                                        if (briefingData?.gameOver) { setWinner(briefingData.gameOver); setPhase(PHASES.GAME_OVER); } 
                                        else { setDayCount(d => d + 1); setPhase(PHASES.DAY); }
                                    }} className="w-full py-6 rounded-full bg-gradient-to-r from-emerald-600 to-emerald-400 text-slate-950 font-black text-xl sm:text-2xl tracking-[0.2em] uppercase transition-all duration-400 transform active:scale-[0.98] shadow-[0_20px_50px_rgba(16,185,129,0.5)] border-2 border-emerald-300 relative overflow-hidden group flex items-center justify-center gap-4">
                                        <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-30 transition-opacity" />
                                        <Icon name={briefingData?.gameOver ? "Trophy" : "Sun"} size={28} className="relative z-10" />
                                        <span className="relative z-10 drop-shadow-sm">{briefingData?.gameOver ? 'Показать Итоги' : `Начать День ${dayCount + 1}`}</span>
                                    </button>
                                )}

                                {phase === PHASES.GAME_OVER && (
                                    <button onClick={() => {haptic('light'); triggerSound('select'); setPhase(PHASES.SETUP);}} className="w-full py-6 rounded-full bg-white text-slate-950 font-black text-xl sm:text-2xl tracking-[0.2em] uppercase transition-all duration-400 transform active:scale-[0.98] shadow-[0_20px_50px_rgba(255,255,255,0.3)] border-2 border-white relative overflow-hidden group flex items-center justify-center gap-4">
                                        <div className="absolute inset-0 bg-indigo-100 opacity-0 group-hover:opacity-100 transition-opacity" />
                                        <Icon name="RotateCcw" size={28} className="relative z-10 text-indigo-600" />
                                        <span className="relative z-10 drop-shadow-sm">Новая Симуляция</span>
                                    </button>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MafiaOS />);
    </script>
</body>
</html>
