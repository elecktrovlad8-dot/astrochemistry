<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Астрологическая Алхимия</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 25, 43, 0.95);
            --border-color: rgba(99, 102, 241, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --item-bg: #1e2238;
            --item-border: #3b4261;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1d36 0%, var(--bg-dark) 100%);
            color: var(--text-main); height: 100vh; display: flex; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        #menu-toggle {
            display: none; position: absolute; top: 15px; left: 15px;
            background: var(--item-bg); border: 1px solid var(--border-color);
            color: var(--text-main); width: 45px; height: 45px; border-radius: 8px;
            font-size: 1.5rem; z-index: 2000; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        #overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 1400;
        }
        #overlay.active { display: block; }
        
        /* Стили для модального окна создания человека */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--panel-bg); border: 1px solid var(--accent); border-radius: 12px;
            padding: 20px; z-index: 2500; width: 90%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        .modal.active { display: block; }
        .modal input[type="text"] {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; font-family: inherit; font-size: 1rem; margin-bottom: 15px;
        }
        .modal input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .radio-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .radio-label { flex: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.9rem; }

        #sidebar {
            width: 360px; background: var(--panel-bg); border-right: 1px solid var(--border-color);
            backdrop-filter: blur(10px); display: flex; flex-direction: column; z-index: 1500;
            transition: transform 0.3s ease-in-out;
        }
        .sidebar-header {
            padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color);
            font-weight: 600; letter-spacing: 1px; color: var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }
        #close-menu { display: none; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .columns-container { display: flex; flex: 1; overflow: hidden; }
        .column { flex: 1; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
        .column:last-child { border-right: none; }
        .column-title { text-align: center; font-size: 0.75rem; padding: 10px 2px; background: rgba(0,0,0,0.2); color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .column-list { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 8px; }
        .spawn-btn {
            background: var(--item-bg); border: 1px solid var(--item-border); color: var(--text-main);
            padding: 10px 2px; border-radius: 8px; font-size: 1.2rem; text-align: center;
            cursor: pointer; transition: all 0.2s;
        }
        .spawn-btn:hover { background: #2a2f4c; border-color: var(--accent); transform: translateY(-2px); }
        #board { flex: 1; position: relative; overflow: hidden; }
        .instruction { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.2); pointer-events: none; line-height: 1.5; z-index: 5; }
        #trash-can {
            position: absolute; bottom: 20px; right: 20px; width: 60px; height: 60px; background: rgba(22, 25, 43, 0.6);
            border: 2px dashed var(--item-border); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--text-muted); z-index: 10; transition: all 0.2s;
        }
        #trash-can.hovered { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; transform: scale(1.15); }
        #description-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 650px; max-height: 60vh;
            background: rgba(15, 17, 26, 0.95); border: 1px solid var(--accent); border-radius: 12px;
            padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
            flex-direction: column; z-index: 20; pointer-events: auto;
        }
        #desc-title { color: var(--accent); margin: 0 0 10px 0; font-size: 1.1rem; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        #desc-text { color: var(--text-main); font-size: 0.95rem; line-height: 1.4; margin: 0; overflow-y: auto; padding-right: 5px; }
        .info-block { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 10px 12px; margin-bottom: 10px; }
        .info-block.empty { border-left-color: #475569; background: rgba(0,0,0,0.2); }
        .info-block-title { font-weight: 600; color: #a5b4fc; margin-bottom: 4px; font-size: 0.9rem; }
        .info-block.empty .info-block-title { color: #64748b; }
        .info-block-text { font-size: 0.85rem; color: #cbd5e1; white-space: pre-wrap; }
        .info-block-text.empty { color: #64748b; font-style: italic; }
        .dev-key { font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; color: #fbbf24; font-size: 0.8rem; margin-top: 5px; display: inline-block; font-style: normal; }
        .inventory-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .remove-btn { background: rgba(239, 68, 68, 0.8); color: white; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem; transition: 0.2s; }
        .remove-btn:hover { background: rgba(239, 68, 68, 1); transform: scale(1.05); }
        .section-header { font-weight: bold; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin: 15px 0 10px 0; letter-spacing: 1px; }
        .board-item {
            position: absolute; background: rgba(15, 17, 26, 0.3);
            border: 1px solid rgba(129, 140, 248, 0.2); border-radius: 8px; padding: 6px 12px;
            font-size: 1.5rem; font-weight: bold; cursor: grab; transition: transform 0.2s, filter 0.2s, color 0.2s; touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            white-space: nowrap; text-align: center; line-height: 1.2; color: #e2e8f0; text-shadow: 0 0 10px rgba(129, 140, 248, 0.6);
        }
        .board-item:active { cursor: grabbing; }
        .board-item:hover { transform: scale(1.1); color: #ffffff; filter: drop-shadow(0 0 12px var(--accent)); }
        .board-item.highlight { color: #ffd700; transform: scale(1.2); filter: drop-shadow(0 0 15px #ffd700); }
        .board-item.person { color: #93c5fd; font-size: 1.8rem; text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
        .board-item.couple { color: #f9a8d4; font-size: 1.8rem; text-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
        .board-item.bounce { transition: left 0.3s ease, top 0.3s ease, color 0.3s ease; color: #ef4444 !important; filter: drop-shadow(0 0 15px #ef4444); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b4261; border-radius: 10px; }
        #save-indicator {
            position: absolute; top: 15px; right: 15px; font-size: 0.75rem; color: var(--text-muted);
            background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 12px; opacity: 0; transition: opacity 0.3s; z-index: 30;
        }
        #save-indicator.visible { opacity: 1; }
        @media (max-width: 768px) {
            #menu-toggle { display: flex; }
            #sidebar { position: absolute; top: 0; left: 0; height: 100%; width: 320px; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.7); }
            #sidebar.open { transform: translateX(0); }
            #close-menu { display: block; }
            .instruction { display: none; }
            #description-panel { bottom: 90px; width: 90%; }
        }
    </style>
</head>
<body>

    <div id="overlay"></div>
    
    <!-- Модальное окно для создания человека -->
    <div id="person-modal" class="modal">
        <h3 style="margin-top:0; color:var(--accent);">Новый человек</h3>
        <input type="text" id="person-name" placeholder="Имя (например, Иван)" autocomplete="off">
        <div class="radio-group">
            <label class="radio-label"><input type="radio" name="person-gender" value="male" checked> 👨 Муж</label>
            <label class="radio-label"><input type="radio" name="person-gender" value="female"> 👩 Жен</label>
        </div>
        <div style="display:flex; gap:10px;">
            <button id="person-save" class="spawn-btn" style="flex:1; background:var(--accent); color:#fff; border:none; padding:8px;">Создать</button>
            <button id="person-cancel" class="spawn-btn" style="flex:1; background:transparent; color:var(--text-muted); border: 1px solid var(--border-color); padding:8px;">Отмена</button>
        </div>
    </div>

    <div id="menu-toggle">☰</div>
    <div id="save-indicator">💾 Сохранено</div>

    <div id="sidebar">
        <div class="sidebar-header">
            ЭЛЕМЕНТЫ
            <button id="close-menu">✖</button>
        </div>
        <div id="add-person-btn" class="spawn-btn" style="margin: 10px; background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; color: #93c5fd;">
            ➕ 🧑 Создать Человека
        </div>
        <div class="columns-container">
            <div class="column">
                <div class="column-title">ЗНАКИ</div>
                <div class="column-list" id="list-signs"></div>
            </div>
            <div class="column">
                <div class="column-title">ПЛАНЕТЫ</div>
                <div class="column-list" id="list-planets"></div>
            </div>
            <div class="column">
                <div class="column-title">ДОМА</div>
                <div class="column-list" id="list-houses"></div>
            </div>
        </div>
        <div style="padding: 10px;">
            <button id="reset-board-btn" class="spawn-btn" style="width:100%; color:#f87171; border-color:#f87171;">🗑️ Очистить всё и сбросить</button>
        </div>
    </div>

    <div id="board">
        <div class="instruction">
            Кликай на символы слева.<br>
            Собери <b>полную комбинацию</b> (Планета+Знак+Дом).<br>
            Кидай готовые комбинации в Человека.<br>
            Соединяй людей для синастрии.<br>
            Кликни по элементу, чтобы прочесть описание.
        </div>
        <div id="trash-can">🗑️</div>
    </div>

    <div id="description-panel">
        <h3 id="desc-title">Символ</h3>
        <div id="desc-text">Описание...</div>
    </div>

    <script type="module">
    import {
        PLANET_ORDER, ElementsRepository, DescriptionsRepository
    } from './astro-database.js';

    'use strict';

    class StorageService {
        static #KEY = 'astro-alchemy-state-v1';
        static #MAX_ITEMS = 500;

        load() {
            let raw;
            try { raw = localStorage.getItem(StorageService.#KEY); } catch (e) { return null; }
            if (!raw) return null;
            let parsed;
            try { parsed = JSON.parse(raw); } catch (e) { return null; }
            return this.#validateSchema(parsed) ? parsed : null;
        }

        save(state) {
            try {
                localStorage.setItem(StorageService.#KEY, JSON.stringify(state));
                return true;
            } catch (e) { return false; }
        }

        clear() {
            try { localStorage.removeItem(StorageService.#KEY); } catch (e) {}
        }

        #validateSchema(data) {
            if (!data || typeof data !== 'object') return false;
            if (!Array.isArray(data.items)) return false;
            if (data.items.length > StorageService.#MAX_ITEMS) return false;

            const isFiniteNumber = (n) => typeof n === 'number' && Number.isFinite(n);
            const isValidFormula = (f) =>
                f && typeof f === 'object' &&
                typeof f.text === 'string' && f.text.length < 200 &&
                (f.planetId === null || typeof f.planetId === 'string') &&
                (f.signId === null || typeof f.signId === 'string') &&
                (f.houseId === null || typeof f.houseId === 'string') &&
                typeof f.isComplete === 'boolean';

            return data.items.every(item => {
                if (!item || typeof item !== 'object') return false;
                if (!['astro', 'person', 'couple'].includes(item.type)) return false;
                if (typeof item.uid !== 'string' || !/^uid_[\w-]+$/.test(item.uid)) return false;
                if (!isFiniteNumber(item.x) || !isFiniteNumber(item.y)) return false;

                if (item.type === 'astro') {
                    return Array.isArray(item.formulas) && item.formulas.every(isValidFormula);
                }
                if (item.type === 'person') {
                    if (item.name && typeof item.name !== 'string') return false;
                    if (item.gender && typeof item.gender !== 'string') return false;
                    return Array.isArray(item.inventory) && item.inventory.every(isValidFormula);
                }
                if (item.type === 'couple') {
                    if (item.person1Name && typeof item.person1Name !== 'string') return false;
                    if (item.person2Name && typeof item.person2Name !== 'string') return false;
                    return Array.isArray(item.person1Inventory) && item.person1Inventory.every(isValidFormula)
                        && Array.isArray(item.person2Inventory) && item.person2Inventory.every(isValidFormula);
                }
                return false;
            });
        }
    }

    const SafeDOM = {
        el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        },
        clear(node) {
            while (node.firstChild) node.removeChild(node.firstChild);
        }
    };

    class AstroModel {
        constructor(elementsRepo) {
            this.elementsRepo = elementsRepo;
        }

        sortFormulas(list) {
            return list.sort((a, b) => {
                const ia = PLANET_ORDER.indexOf(a.planetId);
                const ib = PLANET_ORDER.indexOf(b.planetId);
                return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
            });
        }

        createFormulaFromElement(item) {
            return {
                text: item.name,
                planetId: item.type === 'planet' ? item.id : null,
                signId: item.type === 'sign' ? item.id : null,
                houseId: item.type === 'house' ? item.id : null,
                isComplete: false
            };
        }

        mergeTwoFormulas(f1, f2) {
            if (f1.planetId && f2.planetId) return null;
            if (f1.signId && f2.signId) return null;
            if (f1.houseId && f2.houseId) return null;

            const planetId = f1.planetId || f2.planetId;
            const signId = f1.signId || f2.signId;
            const houseId = f1.houseId || f2.houseId;

            let text = '';
            if (planetId) text += this.elementsRepo.get(planetId).name + ' ';
            if (signId) text += this.elementsRepo.get(signId).name + ' ';
            if (houseId) text += this.elementsRepo.get(houseId).name;

            return {
                text: text.trim(), planetId, signId, houseId,
                isComplete: Boolean(planetId && signId && houseId)
            };
        }

        hasOverlapByPlanet(listA, listB) {
            const planetsA = listA.map(f => f.planetId).filter(Boolean);
            const planetsB = listB.map(f => f.planetId).filter(Boolean);
            return planetsA.some(p => planetsB.includes(p));
        }

        allComplete(list) {
            return list.length > 0 && list.every(f => f.isComplete);
        }

        addFormulasToInventory(inventory, formulasToAdd) {
            if (!this.allComplete(formulasToAdd)) return false;
            if (this.hasOverlapByPlanet(inventory, formulasToAdd)) return false;
            inventory.push(...formulasToAdd);
            this.sortFormulas(inventory);
            return true;
        }
    }

    class InterpretationRenderer {
        constructor(elementsRepo, descriptionsRepo) {
            this.elementsRepo = elementsRepo;
            this.descriptionsRepo = descriptionsRepo;
        }

        createInfoBlock(key, title) {
            const text = this.descriptionsRepo.find(key);
            const block = SafeDOM.el('div', text ? 'info-block' : 'info-block empty');
            const titleEl = SafeDOM.el('div', 'info-block-title', title);
            block.appendChild(titleEl);

            if (text) {
                block.appendChild(SafeDOM.el('div', 'info-block-text', text));
            } else {
                const textEl = SafeDOM.el('div', 'info-block-text empty');
                textEl.appendChild(document.createTextNode('Текст пока не добавлен.'));
                textEl.appendChild(document.createElement('br'));
                const devKey = SafeDOM.el('span', 'dev-key');
                const b = document.createElement('b');
                b.textContent = `'${key}'`;
                devKey.appendChild(document.createTextNode('Ключ для словаря: '));
                devKey.appendChild(b);
                textEl.appendChild(devKey);
                block.appendChild(textEl);
            }
            return block;
        }

        appendFormulaInterpretation(f, container) {
            const wrapper = SafeDOM.el('div');
            wrapper.style.marginBottom = '20px';
            wrapper.appendChild(SafeDOM.el('div', 'section-header', f.text));

            const keysToRender = [];
            const parts = [f.planetId, f.signId, f.houseId].filter(Boolean);
            
            // Если элементов больше 1 (связка), показываем ТОЛЬКО синтез. Иначе - одиночный элемент.
            if (parts.length > 1) {
                keysToRender.push({ key: parts.join('_'), title: '✨ Синтез связки' });
            } else {
                if (f.planetId) keysToRender.push({ key: f.planetId, title: `🪐 ${this.elementsRepo.get(f.planetId).label} (Планета)` });
                if (f.signId) keysToRender.push({ key: f.signId, title: `🌌 ${this.elementsRepo.get(f.signId).label} (Знак)` });
                if (f.houseId) keysToRender.push({ key: f.houseId, title: `🏠 ${this.elementsRepo.get(f.houseId).label} (Дом)` });
            }

            keysToRender.forEach(k => wrapper.appendChild(this.createInfoBlock(k.key, k.title)));
            container.appendChild(wrapper);
        }
    }

    class BoardController {
        #zIndexCounter = 100;
        #dragState = null; 
        #activeElements = new Map();
        #boardItems = [];

        constructor({ boardEl, trashEl, model, elementsRepo, onShowDescription, onStateChanged }) {
            this.boardEl = boardEl;
            this.trashEl = trashEl;
            this.model = model;
            this.elementsRepo = elementsRepo;
            this.onShowDescription = onShowDescription;
            this.onStateChanged = onStateChanged;
        }

        getActiveElements() { return this.#activeElements; }
        getBoardItems() { return this.#boardItems; }

        generateUid() {
            const rand = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
            return 'uid_' + rand;
        }

        createNode(type, formulas, x, y, extraData = {}) {
            const uid = this.generateUid();
            if (formulas && Array.isArray(formulas)) this.model.sortFormulas(formulas);
            this.#activeElements.set(uid, { type, formulas, ...extraData });

            const el = document.createElement('div');
            el.className = 'board-item ' + type;
            el.dataset.uid = uid;
            this.renderItemContent(el, this.#activeElements.get(uid));

            if (x === null || y === null) {
                const pos = this.#computeSpawnPosition();
                x = pos.x; y = pos.y;
            }

            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.zIndex = this.#zIndexCounter++;
            el.addEventListener('pointerdown', (e) => this.#handleDragStart(e));

            this.boardEl.appendChild(el);
            this.#boardItems.push(el);
            this.onStateChanged();
            return el;
        }

        #computeSpawnPosition() {
            const boardRect = this.boardEl.getBoundingClientRect();
            const x = (boardRect.width / 2) - 40 + (Math.random() * 40 - 20);
            const descPanel = document.getElementById('description-panel');
            let y;
            if (descPanel.style.display === 'flex') {
                const descRect = descPanel.getBoundingClientRect();
                y = (descRect.top - boardRect.top) - 75 + (Math.random() * 20 - 10);
            } else {
                y = (boardRect.height * 0.35) - 30 + (Math.random() * 40 - 20);
            }
            return { x, y: y < 20 ? 20 : y };
        }

        renderItemContent(el, itemData) {
            SafeDOM.clear(el);
            if (itemData.type === 'person') {
                const count = itemData.inventory.length;
                const icon = itemData.gender === 'female' ? '👩' : (itemData.gender === 'male' ? '👨' : '🧑');
                const nameText = itemData.name || 'Человек';

                const nameEl = SafeDOM.el('div');
                nameEl.style.maxWidth = '100px';
                nameEl.style.overflow = 'hidden';
                nameEl.style.textOverflow = 'ellipsis';
                nameEl.appendChild(document.createTextNode(`${icon} ${nameText}`));
                el.appendChild(nameEl);

                if (count > 0) {
                    const span = SafeDOM.el('span', '', `(${count})`);
                    span.style.fontSize = '0.7rem';
                    span.style.marginTop = '4px';
                    el.appendChild(span);
                }
                return;
            }
            if (itemData.type === 'couple') {
                const p1Name = itemData.person1.name || 'П1';
                const p2Name = itemData.person2.name || 'П2';

                const iconEl = SafeDOM.el('div', '', '💞');
                el.appendChild(iconEl);

                const textEl = SafeDOM.el('span', '', `${p1Name} + ${p2Name}`);
                textEl.style.fontSize = '0.65rem';
                textEl.style.marginTop = '4px';
                textEl.style.maxWidth = '120px';
                textEl.style.overflow = 'hidden';
                textEl.style.textOverflow = 'ellipsis';
                el.appendChild(textEl);
                return;
            }
            itemData.formulas.forEach((f, i) => {
                if (i > 0) el.appendChild(document.createElement('br'));
                el.appendChild(document.createTextNode(f.text));
            });
        }

        spawnSingleItem(id) {
            const item = this.elementsRepo.get(id);
            if (!item) return; 
            const formula = this.model.createFormulaFromElement(item);
            this.createNode('astro', [formula], null, null);
        }

        spawnPerson(name = 'Человек', gender = 'male') {
            this.createNode('person', null, null, null, { inventory: [], name, gender });
        }

        spawnCouple(p1, p2, targetNode) {
            const x = parseFloat(targetNode.style.left);
            const y = parseFloat(targetNode.style.top);
            this.createNode('couple', null, x, y, { person1: p1, person2: p2 });
        }

        updatePersonDOM(el, personData) {
            this.renderItemContent(el, personData);
            el.style.transform = 'scale(1.3)';
            setTimeout(() => { if (el) el.style.transform = ''; }, 200);
        }

        removeNode(uid) {
            const el = this.boardEl.querySelector(`[data-uid="${uid}"]`);
            if (el) el.remove();
            this.#boardItems = this.#boardItems.filter(item => item !== el);
            this.#activeElements.delete(uid);
            this.onStateChanged();
        }

        clearAll() {
            this.#boardItems.forEach(el => el.remove());
            this.#boardItems = [];
            this.#activeElements.clear();
            this.onStateChanged();
        }

        #handleDragStart(e) {
            if (e.target.classList.contains('remove-btn')) return;
            const el = e.currentTarget;
            el.style.zIndex = this.#zIndexCounter++;
            const rect = el.getBoundingClientRect();

            this.#dragState = {
                el, uid: el.dataset.uid,
                startMouseX: e.clientX, startMouseY: e.clientY,
                startX: parseFloat(el.style.left), startY: parseFloat(el.style.top),
                offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top
            };

            const move = (ev) => this.#handleDragMove(ev);
            const up = (ev) => {
                this.#handleDragEnd(ev);
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        }

        #handleDragMove(e) {
            const ds = this.#dragState;
            if (!ds) return;
            const boardRect = this.boardEl.getBoundingClientRect();
            ds.el.style.left = (e.clientX - boardRect.left - ds.offsetX) + 'px';
            ds.el.style.top = (e.clientY - boardRect.top - ds.offsetY) + 'px';

            if (this.#isPointerOverTrash(e.clientX, e.clientY)) {
                this.trashEl.classList.add('hovered');
            } else {
                this.trashEl.classList.remove('hovered');
            }
            this.#checkHoverCollision(ds.el);
        }

        #handleDragEnd(e) {
            const ds = this.#dragState;
            if (!ds) return;
            const dist = Math.hypot(e.clientX - ds.startMouseX, e.clientY - ds.startMouseY);

            if (this.#isPointerOverTrash(e.clientX, e.clientY)) {
                this.removeNode(ds.uid);
                this.trashEl.classList.remove('hovered');
                this.#dragState = null;
                return;
            }

            if (dist < 5) {
                ds.el.style.left = ds.startX + 'px';
                ds.el.style.top = ds.startY + 'px';
                this.onShowDescription(ds.uid);
            } else {
                this.#attemptCombine(ds);
            }

            this.#boardItems.forEach(item => item.classList.remove('highlight'));
            this.#dragState = null;
            this.onStateChanged();
        }

        #isPointerOverTrash(x, y) {
            const rect = this.trashEl.getBoundingClientRect();
            return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        }

        #getCollidingElement(sourceEl) {
            const rect1 = sourceEl.getBoundingClientRect();
            for (const targetEl of this.#boardItems) {
                if (targetEl === sourceEl) continue;
                const rect2 = targetEl.getBoundingClientRect();
                if (!(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom)) {
                    return targetEl;
                }
            }
            return null;
        }

        #checkHoverCollision(sourceEl) {
            this.#boardItems.forEach(item => item.classList.remove('highlight'));
            const colliding = this.#getCollidingElement(sourceEl);
            if (colliding) colliding.classList.add('highlight');
        }

        #bounceSource(el, startX, startY) {
            el.classList.add('bounce');
            el.style.left = startX + 'px';
            el.style.top = startY + 'px';
            setTimeout(() => { if (el) el.classList.remove('bounce'); }, 300);
        }

        #attemptCombine(ds) {
            const targetEl = this.#getCollidingElement(ds.el);
            if (!targetEl) return;

            const sourceUid = ds.uid;
            const targetUid = targetEl.dataset.uid;
            const source = this.#activeElements.get(sourceUid);
            const target = this.#activeElements.get(targetUid);
            if (!source || !target) return;

            if (source.type === 'person' && target.type === 'person') {
                this.spawnCouple(source, target, targetEl);
                this.removeNode(sourceUid);
                this.removeNode(targetUid);
                return;
            }
            if (source.type === 'couple' || target.type === 'couple') {
                this.#bounceSource(ds.el, ds.startX, ds.startY);
                return;
            }
            if (source.type === 'astro' && target.type === 'person') {
                if (this.model.addFormulasToInventory(target.inventory, source.formulas)) {
                    this.updatePersonDOM(targetEl, target);
                    this.removeNode(sourceUid);
                } else {
                    this.#bounceSource(ds.el, ds.startX, ds.startY);
                }
                return;
            }
            if (source.type === 'person' && target.type === 'astro') {
                if (this.model.addFormulasToInventory(source.inventory, target.formulas)) {
                    this.updatePersonDOM(ds.el, source);
                    this.removeNode(targetUid);
                } else {
                    this.#bounceSource(ds.el, ds.startX, ds.startY);
                }
                return;
            }
            if (source.type === 'astro' && target.type === 'astro') {
                const sourceComplete = this.model.allComplete(source.formulas);
                const targetComplete = this.model.allComplete(target.formulas);

                if (source.formulas.length === 1 && target.formulas.length === 1 && !sourceComplete && !targetComplete) {
                    const merged = this.model.mergeTwoFormulas(source.formulas[0], target.formulas[0]);
                    if (merged) {
                        const x = parseFloat(targetEl.style.left);
                        const y = parseFloat(targetEl.style.top);
                        this.createNode('astro', [merged], x, y);
                        this.removeNode(sourceUid);
                        this.removeNode(targetUid);
                        return;
                    }
                }

                if (sourceComplete && targetComplete && !this.model.hasOverlapByPlanet(source.formulas, target.formulas)) {
                    const combined = [...source.formulas, ...target.formulas];
                    const x = parseFloat(targetEl.style.left);
                    const y = parseFloat(targetEl.style.top);
                    this.createNode('astro', combined, x, y);
                    this.removeNode(sourceUid);
                    this.removeNode(targetUid);
                    return;
                }
            }
            this.#bounceSource(ds.el, ds.startX, ds.startY);
        }

        extractFromPerson(personUid, index) {
            const person = this.#activeElements.get(personUid);
            if (!person) return;
            const extracted = person.inventory.splice(index, 1)[0];
            const personEl = this.boardEl.querySelector(`[data-uid="${personUid}"]`);
            if (personEl) this.updatePersonDOM(personEl, person);
            const x = personEl ? parseFloat(personEl.style.left) + 50 : null;
            const y = personEl ? parseFloat(personEl.style.top) + 50 : null;
            this.createNode('astro', [extracted], x, y);
            this.onShowDescription(personUid);
        }

        serializeState() {
            const items = [];
            for (const el of this.#boardItems) {
                const uid = el.dataset.uid;
                const data = this.#activeElements.get(uid);
                if (!data) continue;
                const x = parseFloat(el.style.left) || 0;
                const y = parseFloat(el.style.top) || 0;

                if (data.type === 'astro') {
                    items.push({ uid, type: 'astro', x, y, formulas: data.formulas });
                } else if (data.type === 'person') {
                    items.push({ uid, type: 'person', x, y, inventory: data.inventory, name: data.name, gender: data.gender });
                } else if (data.type === 'couple') {
                    items.push({
                        uid, type: 'couple', x, y,
                        person1Inventory: data.person1.inventory || [], person2Inventory: data.person2.inventory || [],
                        person1Name: data.person1.name, person1Gender: data.person1.gender,
                        person2Name: data.person2.name, person2Gender: data.person2.gender
                    });
                }
            }
            return { items, savedAt: Date.now() };
        }

        restoreState(state) {
            if (!state || !Array.isArray(state.items)) return;
            for (const item of state.items) {
                if (item.type === 'astro') {
                    this.#restoreNode('astro', item.uid, item.x, item.y, { formulas: item.formulas });
                } else if (item.type === 'person') {
                    this.#restoreNode('person', item.uid, item.x, item.y, { inventory: item.inventory, name: item.name, gender: item.gender });
                } else if (item.type === 'couple') {
                    this.#restoreNode('couple', item.uid, item.x, item.y, {
                        person1: { type: 'person', inventory: item.person1Inventory, name: item.person1Name, gender: item.person1Gender },
                        person2: { type: 'person', inventory: item.person2Inventory, name: item.person2Name, gender: item.person2Gender }
                    });
                }
            }
        }

        #restoreNode(type, uid, x, y, extraData) {
            this.#activeElements.set(uid, { type, ...extraData });
            const el = document.createElement('div');
            el.className = 'board-item ' + type;
            el.dataset.uid = uid;
            this.renderItemContent(el, this.#activeElements.get(uid));
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.zIndex = this.#zIndexCounter++;
            el.addEventListener('pointerdown', (e) => this.#handleDragStart(e));
            this.boardEl.appendChild(el);
            this.#boardItems.push(el);
        }
    }

    class UIController {
        constructor({ boardController, interpretationRenderer, dom }) {
            this.boardController = boardController;
            this.interpretationRenderer = interpretationRenderer;
            this.dom = dom;
        }

        showDescription(uid) {
            const item = this.boardController.getActiveElements().get(uid);
            if (!item) return;
            const { descTitle, descText, descPanel } = this.dom;
            SafeDOM.clear(descText);

            if (item.type === 'person') {
                this.#renderPerson(uid, item, descTitle, descText);
            } else if (item.type === 'couple') {
                this.#renderCouple(item, descTitle, descText);
            } else {
                descTitle.textContent = 'Разбор комбинации';
                item.formulas.forEach(f => this.interpretationRenderer.appendFormulaInterpretation(f, descText));
            }
            descPanel.style.display = 'flex';
        }

        #renderPerson(uid, item, descTitle, descText) {
            const icon = item.gender === 'female' ? '👩' : (item.gender === 'male' ? '👨' : '🧑');
            descTitle.textContent = `${icon} Карта: ${item.name || 'Человек'}`;
            
            if (item.inventory.length === 0) {
                const block = SafeDOM.el('div', 'info-block');
                block.appendChild(SafeDOM.el('div', 'info-block-text', 'Карта пуста. Перетащите сюда готовые комбинации (Планета+Знак+Дом).'));
                descText.appendChild(block);
                return;
            }

            const editSection = SafeDOM.el('div');
            editSection.appendChild(SafeDOM.el('div', 'section-header', 'Содержимое карты (Редактор)'));
            item.inventory.forEach((f, index) => {
                const row = SafeDOM.el('div', 'inventory-item');
                row.appendChild(SafeDOM.el('span', '', f.text));
                const btn = SafeDOM.el('button', 'remove-btn', 'Извлечь');
                btn.addEventListener('click', () => this.boardController.extractFromPerson(uid, index));
                row.appendChild(btn);
                editSection.appendChild(row);
            });
            descText.appendChild(editSection);

            const analysisSection = SafeDOM.el('div');
            const header = SafeDOM.el('div', 'section-header', 'Трактовка аспектов');
            header.style.marginTop = '25px';
            header.style.borderTop = '1px solid rgba(255,255,255,0.1)';
            header.style.paddingTop = '15px';
            analysisSection.appendChild(header);
            item.inventory.forEach(f => this.interpretationRenderer.appendFormulaInterpretation(f, analysisSection));
            descText.appendChild(analysisSection);
        }

        #renderCouple(item, descTitle, descText) {
            const p1 = item.person1, p2 = item.person2;
            const n1 = p1.name || 'Партнер 1';
            const n2 = p2.name || 'Партнер 2';
            const elementsRepo = this.interpretationRenderer.elementsRepo;

            descTitle.textContent = `💞 Синастрия: ${n1} и ${n2}`;

            if ((!p1.inventory || p1.inventory.length === 0) && (!p2.inventory || p2.inventory.length === 0)) {
                const block = SafeDOM.el('div', 'info-block');
                block.appendChild(SafeDOM.el('div', 'info-block-text', 'Оба партнера пусты. Наполните их картами для расчета взаимодействия.'));
                descText.appendChild(block);
                return;
            }

            const synastrySection = SafeDOM.el('div');
            const synHeader = SafeDOM.el('div', 'section-header', '🔥 Межкарточные связки (Взаимодействие)');
            synHeader.style.color = 'var(--accent)';
            synHeader.style.fontSize = '0.95rem';
            synHeader.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
            synHeader.style.paddingBottom = '5px';
            synastrySection.appendChild(synHeader);

            let hasInteractions = false;
            if (p1.inventory && p2.inventory) {
                p1.inventory.forEach(f1 => {
                    p2.inventory.forEach(f2 => {
                        hasInteractions = true;
                        const wrapper = SafeDOM.el('div');
                        wrapper.style.marginBottom = '15px';
                        const header = SafeDOM.el('div', 'section-header', `П1 (${f1.text}) ↔ П2 (${f2.text})`);
                        header.style.color = '#f9a8d4';
                        wrapper.appendChild(header);

                        if (f1.planetId && f2.planetId) {
                            const pKey = `syn_${f1.planetId}_${f2.planetId}`;
                            const title = `✨ ${elementsRepo.get(f1.planetId).label} (П1) + ${elementsRepo.get(f2.planetId).label} (П2)`;
                            wrapper.appendChild(this.interpretationRenderer.createInfoBlock(pKey, title));
                        }
                        if (f1.planetId && f2.houseId) {
                            const hKey = `syn_${f1.planetId}_${f2.houseId}`;
                            const title = `🏠 ${elementsRepo.get(f1.planetId).label} (П1) в ${elementsRepo.get(f2.houseId).label} (П2)`;
                            wrapper.appendChild(this.interpretationRenderer.createInfoBlock(hKey, title));
                        }
                        synastrySection.appendChild(wrapper);
                    });
                });
            }
            if (!hasInteractions) {
                const block = SafeDOM.el('div', 'info-block');
                block.appendChild(SafeDOM.el('div', 'info-block-text', 'Добавьте хотя бы по одной комбинации каждому партнеру для расчета связок.'));
                synastrySection.appendChild(block);
            }
            descText.appendChild(synastrySection);

            this.#renderPersonCard(p1, `🧑 Карта: ${n1}`, '#93c5fd', descText);
            this.#renderPersonCard(p2, `🧑 Карта: ${n2}`, '#f9a8d4', descText);
        }

        #renderPersonCard(person, title, color, container) {
            const section = SafeDOM.el('div');
            section.style.marginTop = '25px';
            const header = SafeDOM.el('div', 'section-header', title);
            header.style.color = color;
            header.style.fontSize = '0.95rem';
            header.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
            header.style.paddingBottom = '5px';
            section.appendChild(header);

            if (person.inventory && person.inventory.length > 0) {
                person.inventory.forEach(f => this.interpretationRenderer.appendFormulaInterpretation(f, section));
            } else {
                const block = SafeDOM.el('div', 'info-block');
                block.appendChild(SafeDOM.el('div', 'info-block-text', 'Карта пуста'));
                section.appendChild(block);
            }
            container.appendChild(section);
        }
    }

    class App {
        constructor() {
            this.elementsRepo = new ElementsRepository();
            this.descriptionsRepo = new DescriptionsRepository();
            this.model = new AstroModel(this.elementsRepo);
            this.interpretationRenderer = new InterpretationRenderer(this.elementsRepo, this.descriptionsRepo);
            this.storage = new StorageService();

            this.dom = {
                board: document.getElementById('board'),
                trashCan: document.getElementById('trash-can'),
                descPanel: document.getElementById('description-panel'),
                descTitle: document.getElementById('desc-title'),
                descText: document.getElementById('desc-text'),
                sidebar: document.getElementById('sidebar'),
                overlay: document.getElementById('overlay'),
                saveIndicator: document.getElementById('save-indicator'),
                personModal: document.getElementById('person-modal'),
                personNameInput: document.getElementById('person-name'),
                personSaveBtn: document.getElementById('person-save'),
                personCancelBtn: document.getElementById('person-cancel')
            };

            this.boardController = new BoardController({
                boardEl: this.dom.board, trashEl: this.dom.trashCan, model: this.model, elementsRepo: this.elementsRepo,
                onShowDescription: (uid) => this.uiController.showDescription(uid),
                onStateChanged: () => this.#scheduleAutosave()
            });

            this.uiController = new UIController({
                boardController: this.boardController, interpretationRenderer: this.interpretationRenderer, dom: this.dom
            });

            this.#autosaveTimer = null;
        }

        #autosaveTimer = null;

        #scheduleAutosave() {
            clearTimeout(this.#autosaveTimer);
            this.#autosaveTimer = setTimeout(() => this.#persist(), 400);
        }

        #persist() {
            const state = this.boardController.serializeState();
            if (this.storage.save(state)) this.#flashSaveIndicator();
        }

        #flashSaveIndicator() {
            const ind = this.dom.saveIndicator;
            ind.classList.add('visible');
            clearTimeout(this._indicatorTimer);
            this._indicatorTimer = setTimeout(() => ind.classList.remove('visible'), 1200);
        }

        #restorePreviousSession() {
            const state = this.storage.load();
            if (state) this.boardController.restoreState(state);
        }

        #populateMenu(listArray, containerId) {
            const container = document.getElementById(containerId);
            listArray.forEach(item => {
                const btn = SafeDOM.el('div', 'spawn-btn', item.name);
                btn.addEventListener('click', () => {
                    this.boardController.spawnSingleItem(item.id);
                    if (window.innerWidth <= 768) this.#closeMenu();
                });
                container.appendChild(btn);
            });
        }

        #closeMenu() {
            this.dom.sidebar.classList.remove('open');
            this.dom.overlay.classList.remove('active');
        }

        #bindGlobalUI() {
            document.getElementById('menu-toggle').addEventListener('click', () => {
                this.dom.sidebar.classList.add('open');
                this.dom.overlay.classList.add('active');
            });
            document.getElementById('close-menu').addEventListener('click', () => this.#closeMenu());

            const closePersonModal = () => {
                this.dom.personModal.classList.remove('active');
                if (!this.dom.sidebar.classList.contains('open')) {
                    this.dom.overlay.classList.remove('active');
                }
            };

            document.getElementById('add-person-btn').addEventListener('click', () => {
                this.dom.personModal.classList.add('active');
                this.dom.overlay.classList.add('active');
                this.dom.personNameInput.value = '';
                this.dom.personNameInput.focus();
            });

            this.dom.personCancelBtn.addEventListener('click', closePersonModal);

            this.dom.personSaveBtn.addEventListener('click', () => {
                const name = this.dom.personNameInput.value.trim() || 'Неизвестный';
                const genderNode = document.querySelector('input[name="person-gender"]:checked');
                const gender = genderNode ? genderNode.value : 'male';
                this.boardController.spawnPerson(name, gender);
                closePersonModal();
                if (window.innerWidth <= 768) this.#closeMenu();
            });

            this.dom.overlay.addEventListener('click', () => {
                this.#closeMenu();
                closePersonModal();
            });

            document.getElementById('reset-board-btn').addEventListener('click', () => {
                if (confirm('Точно очистить всю доску? Это действие необратимо.')) {
                    this.boardController.clearAll();
                    this.storage.clear();
                }
            });

            this.dom.board.addEventListener('click', (e) => {
                if (e.target === this.dom.board || e.target === this.dom.trashCan || e.target.classList.contains('instruction')) {
                    this.dom.descPanel.style.display = 'none';
                }
            });

            window.addEventListener('beforeunload', () => this.#persist());
        }

        init() {
            this.#populateMenu(this.elementsRepo.getSigns(), 'list-signs');
            this.#populateMenu(this.elementsRepo.getPlanets(), 'list-planets');
            this.#populateMenu(this.elementsRepo.getHouses(), 'list-houses');
            this.#bindGlobalUI();
            this.#restorePreviousSession(); 
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const app = new App();
        app.init();
        window.__astroApp = app;
    });
    </script>
</body>
