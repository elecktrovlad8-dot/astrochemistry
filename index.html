<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астрологическая Алхимия</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 25, 43, 0.85);
            --border-color: rgba(99, 102, 241, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --item-bg: #1e2238;
            --item-border: #3b4261;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1d36 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden; /* Запрещаем скролл всей страницы */
            user-select: none; /* Запрещаем выделение текста при перетаскивании */
        }

        /* ЛЕВАЯ ПАНЕЛЬ С ЭЛЕМЕНТАМИ */
        #sidebar {
            width: 450px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .columns-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .column:last-child { border-right: none; }

        .column-title {
            text-align: center;
            font-size: 0.8rem;
            padding: 10px 5px;
            background: rgba(0,0,0,0.2);
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .column-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Кнопка спавна элемента в меню */
        .spawn-btn {
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .spawn-btn:hover {
            background: #2a2f4c;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* ИГРОВОЕ ПОЛЕ */
        #board {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ПАНЕЛЬ ОПИСАНИЯ ВНИЗУ */
        #description-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: rgba(15, 17, 26, 0.95);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* Скрыто по умолчанию */
            z-index: 20;
            pointer-events: none; /* Чтобы не мешало перетаскивать под ним */
        }

        #desc-title {
            color: var(--accent);
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        #desc-text {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        /* САМИ ИГРОВЫЕ ЯЧЕЙКИ НА ДОСКЕ */
        .board-item {
            position: absolute;
            background: linear-gradient(135deg, var(--item-bg), #121422);
            border: 2px solid var(--item-border);
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: grab;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: border-color 0.2s, box-shadow 0.2s;
            touch-action: none; /* Важно для работы тачей на телефонах */
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        
        .board-item:active {
            cursor: grabbing;
        }

        .board-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.4);
        }

        .board-item.highlight {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }
        
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b4261; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">ЭЛЕМЕНТЫ</div>
        <div class="columns-container">
            <div class="column">
                <div class="column-title">ЗНАКИ</div>
                <div class="column-list" id="list-signs"></div>
            </div>
            <div class="column">
                <div class="column-title">ПЛАНЕТЫ & УЗЛЫ</div>
                <div class="column-list" id="list-planets"></div>
            </div>
            <div class="column">
                <div class="column-title">ДОМА</div>
                <div class="column-list" id="list-houses"></div>
            </div>
        </div>
    </div>

    <div id="board">
        <div style="position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.2); pointer-events: none;">
            Кликай на элементы слева.<br>Перетаскивай их друг на друга на этой доске.
        </div>
    </div>

    <div id="description-panel">
        <h3 id="desc-title">Название</h3>
        <p id="desc-text">Описание...</p>
    </div>

    <script>
        // =====================================================================
        // БЛОК 1: БАЗА ДАННЫХ ДЛЯ НАСТРОЙКИ (ТВОЯ ЗОНА ОТВЕТСТВЕННОСТИ)
        // =====================================================================

        // 1. СПИСКИ СТАРТОВЫХ ЭЛЕМЕНТОВ (Для левого меню)
        // Ты можешь менять 'name' (как выглядит) и добавлять новые. 
        // 'id' - это уникальный код элемента для рецептов.
        
        const baseSigns = [
            { id: 'aries', name: 'Овен' }, { id: 'taurus', name: 'Телец' }, { id: 'gemini', name: 'Близнецы' },
            { id: 'cancer', name: 'Рак' }, { id: 'leo', name: 'Лев' }, { id: 'virgo', name: 'Дева' },
            { id: 'libra', name: 'Весы' }, { id: 'scorpio', name: 'Скорпион' }, { id: 'sagittarius', name: 'Стрелец' },
            { id: 'capricorn', name: 'Козерог' }, { id: 'aquarius', name: 'Водолей' }, { id: 'pisces', name: 'Рыбы' }
        ];

        const basePlanets = [
            { id: 'sun', name: 'Солнце' }, { id: 'moon', name: 'Луна' }, { id: 'mercury', name: 'Меркурий' },
            { id: 'venus', name: 'Венера' }, { id: 'mars', name: 'Марс' }, { id: 'jupiter', name: 'Юпитер' },
            { id: 'saturn', name: 'Сатурн' }, { id: 'uranus', name: 'Уран' }, { id: 'neptune', name: 'Нептун' },
            { id: 'pluto', name: 'Плутон' }, { id: 'node_n', name: 'Сев. Узел' }, { id: 'node_s', name: 'Юж. Узел' },
            { id: 'asc', name: 'Асцендент' }
        ];

        const baseHouses = [
            { id: 'h1', name: '1 Дом' }, { id: 'h2', name: '2 Дом' }, { id: 'h3', name: '3 Дом' },
            { id: 'h4', name: '4 Дом' }, { id: 'h5', name: '5 Дом' }, { id: 'h6', name: '6 Дом' },
            { id: 'h7', name: '7 Дом' }, { id: 'h8', name: '8 Дом' }, { id: 'h9', name: '9 Дом' },
            { id: 'h10', name: '10 Дом' }, { id: 'h11', name: '11 Дом' }, { id: 'h12', name: '12 Дом' }
        ];

        // 2. СЛОВАРЬ ВСЕХ ЭЛЕМЕНТОВ И ИХ ОПИСАНИЙ (Включая результаты слияний)
        // Сюда нужно будет добавлять всё: и базовые, и сложные элементы.
        const elementsData = {
            // Базовые описания (показываются, если просто кликнуть на планету/знак на доске)
            'sun': { name: 'Солнце', desc: 'Центр личности, эго, сознание, жизненные силы.' },
            'aries': { name: 'Овен', desc: 'Импульс, инициатива, борьба, первооткрыватель.' },
            'h1': { name: '1 Дом', desc: 'Дом личности, внешности, масок и первого впечатления.' },
            'moon': { name: 'Луна', desc: 'Подсознание, эмоции, привычки, инстинкты.' },
            'scorpio': { name: 'Скорпион', desc: 'Глубина, трансформация, кризис, магнетизм.' },

            // Описания твоих сложных соединений
            'sun_in_aries': { 
                name: 'Солнце в Овне', 
                desc: 'Яркая индивидуальность. Человек действует быстро, прямолинейно. Лидер, который зажигает других, но может быстро перегорать.' 
            },
            'moon_in_scorpio': {
                name: 'Луна в Скорпионе',
                desc: 'Невероятно глубокие и интенсивные эмоции. Человек скрытен, но чувствует мир на уровне рентгена.'
            },
            'sun_aries_h1': {
                name: 'Солнце в Овне в 1 Доме',
                desc: 'Двойной заряд марсианской энергии! Этот человек сразу бросается в глаза. Внешность и характер полностью синхронизированы в мощном порыве к лидерству.'
            },
            'mega_combo': {
                name: 'Комплекс: Огненное Ядро + Водная Душа',
                desc: 'Этот человек внешне действует как пробивной воин (Солнце в Овне в 1 доме), но внутри руководствуется глубочайшими страстями и интуицией (Луна в Скорпионе). Сложный, но невероятно сильный характер!'
            }
            // Добавляй сюда тысячи своих описаний...
        };

        // 3. РЕЦЕПТЫ АЛХИМИИ (Что + Что = Результат)
        // Формат: "id1,id2": "id_результата"
        // ПРАВИЛО: Идентификаторы слева пиши в алфавитном порядке! 
        // (Например: aries и sun -> 'aries,sun'. Так движку будет легче их сравнивать).
        const recipes = {
            'aries,sun': 'sun_in_aries', // Овен + Солнце = Солнце в Овне
            'moon,scorpio': 'moon_in_scorpio', // Луна + Скорпион = Луна в Скорпионе
            
            // Многоуровневые соединения:
            'h1,sun_in_aries': 'sun_aries_h1', // Солнце в Овне + 1 Дом = Солнце в Овне в 1 Доме
            
            // Финальное слияние:
            'moon_in_scorpio,sun_aries_h1': 'mega_combo'
        };


        // =====================================================================
        // БЛОК 2: ИГРОВОЙ ДВИЖОК (НЕ МЕНЯЙ, ЕСЛИ НЕ ЗНАЕШЬ JS)
        // =====================================================================

        const board = document.getElementById('board');
        const descPanel = document.getElementById('description-panel');
        const descTitle = document.getElementById('desc-title');
        const descText = document.getElementById('desc-text');
        
        let zIndexCounter = 100;
        let activeDragElement = null;
        let offsetX = 0, offsetY = 0;
        let boardItems = []; // Хранит DOM-элементы на доске

        // 1. Отрисовка левого меню
        function populateMenu(listArray, containerId) {
            const container = document.getElementById(containerId);
            listArray.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'spawn-btn';
                btn.innerText = item.name;
                // При клике создаем элемент на доске
                btn.onclick = () => spawnElementOnBoard(item.id, item.name);
                container.appendChild(btn);
            });
        }
        
        populateMenu(baseSigns, 'list-signs');
        populateMenu(basePlanets, 'list-planets');
        populateMenu(baseHouses, 'list-houses');

        // 2. Создание элемента на доске
        function spawnElementOnBoard(id, name, x = null, y = null) {
            const el = document.createElement('div');
            el.className = 'board-item';
            el.dataset.id = id;
            el.innerText = name;
            
            // Если координаты не переданы, бросаем в центр с небольшим случайным разбросом
            if (x === null || y === null) {
                const boardRect = board.getBoundingClientRect();
                x = (boardRect.width / 2) - 50 + (Math.random() * 60 - 30);
                y = (boardRect.height / 2) - 25 + (Math.random() * 60 - 30);
            }

            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.zIndex = zIndexCounter++;

            // События мыши и тачскрина для перетаскивания
            el.addEventListener('pointerdown', handleDragStart);
            
            // Клик для показа описания
            el.addEventListener('click', () => showDescription(id));

            board.appendChild(el);
            boardItems.push(el);
        }

        // 3. Логика показа описания
        function showDescription(id) {
            const data = elementsData[id];
            if (data) {
                descTitle.innerText = data.name;
                descText.innerText = data.desc;
            } else {
                // Заглушка, если ты забыл добавить описание в elementsData
                descTitle.innerText = "Неизвестная комбинация";
                descText.innerText = "Описание для этого элемента еще не добавлено.";
            }
            descPanel.style.display = 'block';
        }

        // 4. Логика перетаскивания (Drag & Drop)
        function handleDragStart(e) {
            activeDragElement = e.target;
            activeDragElement.style.zIndex = zIndexCounter++; // Поднимаем наверх
            
            const rect = activeDragElement.getBoundingClientRect();
            const boardRect = board.getBoundingClientRect();
            
            // Вычисляем смещение мыши относительно левого верхнего угла элемента
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            // Захватываем события движения на всем документе, чтобы не терять элемент при быстром движении
            document.addEventListener('pointermove', handleDragMove);
            document.addEventListener('pointerup', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!activeDragElement) return;

            const boardRect = board.getBoundingClientRect();
            
            // Вычисляем новые координаты относительно доски
            let newX = e.clientX - boardRect.left - offsetX;
            let newY = e.clientY - boardRect.top - offsetY;

            activeDragElement.style.left = newX + 'px';
            activeDragElement.style.top = newY + 'px';

            // Проверка коллизий во время движения для подсветки
            checkHoverCollision();
        }

        function handleDragEnd(e) {
            if (!activeDragElement) return;

            document.removeEventListener('pointermove', handleDragMove);
            document.removeEventListener('pointerup', handleDragEnd);

            // Проверяем, отпустили ли мы элемент поверх другого
            attemptCombine();

            // Убираем подсветки
            boardItems.forEach(item => item.classList.remove('highlight'));
            
            activeDragElement = null;
        }

        // 5. Поиск пересечений
        function getCollidingElement(sourceEl) {
            const rect1 = sourceEl.getBoundingClientRect();
            
            for (let targetEl of boardItems) {
                if (targetEl === sourceEl) continue; // Не сравниваем с самим собой

                const rect2 = targetEl.getBoundingClientRect();
                
                // Простая проверка пересечения прямоугольников
                if (!(rect1.right < rect2.left || 
                      rect1.left > rect2.right || 
                      rect1.bottom < rect2.top || 
                      rect1.top > rect2.bottom)) {
                    return targetEl;
                }
            }
            return null;
        }

        function checkHoverCollision() {
            boardItems.forEach(item => item.classList.remove('highlight'));
            const colliding = getCollidingElement(activeDragElement);
            if (colliding) {
                colliding.classList.add('highlight');
            }
        }

        // 6. Алхимия: попытка соединения
        function attemptCombine() {
            const targetEl = getCollidingElement(activeDragElement);
            if (!targetEl) return;

            const id1 = activeDragElement.dataset.id;
            const id2 = targetEl.dataset.id;

            // Сортируем ID по алфавиту для правильного ключа
            const sortedIds = [id1, id2].sort().join(',');
            
            const resultId = recipes[sortedIds];

            if (resultId) {
                // РЕЦЕПТ НАЙДЕН!
                // 1. Получаем координаты места соединения
                const spawnX = parseFloat(targetEl.style.left);
                const spawnY = parseFloat(targetEl.style.top);

                // 2. Удаляем старые элементы
                activeDragElement.remove();
                targetEl.remove();
                boardItems = boardItems.filter(el => el !== activeDragElement && el !== targetEl);

                // 3. Спавним новый результат
                const resultData = elementsData[resultId];
                const resultName = resultData ? resultData.name : resultId;
                
                spawnElementOnBoard(resultId, resultName, spawnX, spawnY);
                
                // 4. Сразу показываем описание нового элемента
                showDescription(resultId);
            } else {
                // Отскакивание, если рецепта нет (необязательно, но приятно)
                const currentLeft = parseFloat(activeDragElement.style.left);
                activeDragElement.style.left = (currentLeft + 20) + 'px';
            }
        }

        // Скрываем описание при клике на пустую доску
        board.addEventListener('click', (e) => {
            if (e.target === board) {
                descPanel.style.display = 'none';
            }
        });
    </script>
</body>
</html>
