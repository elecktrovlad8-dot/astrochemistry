<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroChemistry 🌌</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060814;
            --card-bg: rgba(22, 27, 51, 0.7);
            --card-border: rgba(100, 115, 175, 0.3);
            --accent-gold: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.35);
            --purple-glow: rgba(147, 51, 234, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #151936 0%, var(--bg-color) 80%);
            color: #e2e8f0;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(13, 16, 33, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        section {
            margin-bottom: 30px;
        }

        h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            color: #cbd5e1;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card:hover {
            border-color: #818cf8;
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--purple-glow);
        }

        .card.active {
            border-color: var(--accent-gold);
            background: rgba(45, 42, 74, 0.9);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.03);
        }

        .slot-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .slot {
            width: 160px;
            height: 60px;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 12, 24, 0.8);
            font-size: 0.95em;
            color: #64748b;
            transition: all 0.3s;
        }

        .slot.filled {
            border-style: solid;
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: inset 0 0 10px var(--accent-glow);
        }

        .plus {
            font-size: 1.5em;
            color: var(--accent-gold);
        }

        .btn-combine {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: block;
            margin: 0 auto;
        }

        .btn-combine:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        #result {
            margin-top: 25px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 0 20px var(--accent-glow);
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .result-card h4 {
            margin: 0 0 5px 0;
            color: var(--accent-gold);
            font-size: 1.2em;
        }

        .result-card p {
            margin: 0;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.9em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>ASTROCHEMISTRY</h1>
    <div class="subtitle">Соединяйте знаки и планеты, чтобы раскрыть тайны личности</div>

    <div class="container">
        <section>
            <h3>Открытые элементы</h3>
            <div id="inventory" class="grid"></div>
        </section>

        <section>
            <h3>Зона объединения</h3>
            <div class="slot-container">
                <div id="slot1" class="slot">Выбрать элемент</div>
                <span class="plus">+</span>
                <div id="slot2" class="slot">Выбрать элемент</div>
            </div>
            <button class="btn-combine" onclick="combine()">Объединить</button>
        </section>

        <div id="result"></div>
    </div>

    <script>
        let inventory = [
            { id: 'sun', name: '☀️ Солнце' },
            { id: 'moon', name: '🌙 Луна' },
            { id: 'leo', name: '🦁 Лев' },
            { id: 'scorpio', name: '🦂 Скорпион' }
        ];

        const recipes = [
            {
                inputs: ['sun', 'leo'],
                result: { id: 'sun_leo', name: '♌ Солнце во Льве' },
                desc: 'Характеристика: Смелый, творческий и харизматичный лидер.'
            },
            {
                inputs: ['moon', 'scorpio'],
                result: { id: 'moon_scorpio', name: '♏ Луна в Скорпионе' },
                desc: 'Характеристика: Глубокая интуиция, страстность и огромная внутренняя сила.'
            },
            {
                inputs: ['sun', 'moon'],
                result: { id: 'sun_moon', name: '☯️ Гармония Души и Разума' },
                desc: 'Характеристика: Полный внутренний баланс и цельная личность.'
            }
        ];

        let selected = [];

        function renderInventory() {
            const invContainer = document.getElementById('inventory');
            invContainer.innerHTML = '';
            inventory.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'card' + (selected.includes(item) ? ' active' : '');
                btn.innerText = item.name;
                btn.onclick = () => selectItem(item);
                invContainer.appendChild(btn);
            });
        }

        function selectItem(item) {
            if (selected.includes(item)) {
                selected = selected.filter(i => i !== item);
            } else if (selected.length < 2) {
                selected.push(item);
            }
            updateSlots();
            renderInventory();
        }

        function updateSlots() {
            const s1 = document.getElementById('slot1');
            const s2 = document.getElementById('slot2');
            
            s1.innerText = selected[0] ? selected[0].name : 'Выбрать элемент';
            s1.className = 'slot' + (selected[0] ? ' filled' : '');

            s2.innerText = selected[1] ? selected[1].name : 'Выбрать элемент';
            s2.className = 'slot' + (selected[1] ? ' filled' : '');
        }

        function combine() {
            const resDiv = document.getElementById('result');
            if (selected.length < 2) {
                resDiv.innerHTML = '<span class="error-msg">Выберите 2 элемента для соединения!</span>';
                return;
            }

            const ids = selected.map(i => i.id).sort();
            const recipe = recipes.find(r => {
                const req = [...r.inputs].sort();
                return req[0] === ids[0] && req[1] === ids[1];
            });

            if (recipe) {
                resDiv.innerHTML = `
                    <div class="result-card">
                        <h4>✨ ${recipe.result.name}</h4>
                        <p>${recipe.desc}</p>
                    </div>
                `;
                if (!inventory.some(i => i.id === recipe.result.id)) {
                    inventory.push(recipe.result);
                }
            } else {
                resDiv.innerHTML = '<span class="error-msg">❌ Эти элементы не создают нового соединения...</span>';
            }

            selected = [];
            updateSlots();
            renderInventory();
        }

        renderInventory();
    </script>
</body>
</html>
